FKR_KOR_hiding_desc:0 "We share a border with [KOR.GetNameDef], who currently dominates the Korean Peninsula. It is undeniable that if they become fully aware of our existence, they will seek to destroy us. Fortunately, [KOR.GetNameDef], weakened by bureaucracy, internal strife, and incompetent leaders, is blind. With the right choices, we can conceal our activities until we are strong enough to fully reveal our plans. However, we cannot hide in their shadow forever. Over time, it will become increasingly difficult to keep ourselves hidden."
FKR_ancient_korean_literature_category_desc:0 "According to an ancient Korean text, the Korean people were once the rulers of the greatest empire in history, stretching east to west from the Korean Peninsula to Mesopotamia, and north to south from all of Siberia to Northern India and Central Asia—simply put, dominating most of the Eurasian continent."
FKR_unified_earth_government_category_desc:0 "As we reign as a superpower now, there is no great power on Earth capable of checking us. We will soon be able to achieve the great feat of human unification!"
#FKR_future_tech_research_desc:0 "Modern technology will eventually become obsolete. By investing heavily in future technology, we will enjoy a distinct technological advantage."
FKR_strat_ops_command_desc:0 "We need to approach war strategically to win.\n Mustard Gas Shells: [?Root.mustard_gas_cap]"
FKR_future_tech_research_land_desc:0 "In the end, it's the infantry that plants the flag!"
FKR_future_tech_research_air_desc:0 "You cannot win a war with air power alone, but you cannot win a war without it."
FKR_future_tech_research_navy_desc:0 "One thing is certain: without decisive naval power, you can do nothing, but with it, you can achieve all honorable and glorious deeds."

# DECISIONS

#################################
# HIDING FROM THE Korea
#################################

FKR_hide_activity:0 "Conceal Activities in Jeju"
FKR_hide_activity_desc:0 "The intelligence gathering and administrative capabilities of interwar nations are very poor compared to modern times. However, as time passes, we will have to exert more and more effort to conceal our activities from the outside world."
FKR_hide_activity_days_tt:0 "Conceal from §YKorea§! for §Y90 days§!"
FKR_hide_activity_bonus_tt:0 " + [?Root.days_mission_timeout@FKR_hide_activity|H0] §Gadditional§! days"
FKR_hide_activity_crisis:0 "§RWe will face a crisis!§!\n"

# CRISIS
KOR_crisis:0 "§RConcealment Crisis§!"
KOR_crisis_flag:0 "§ROur existence will soon be revealed!§!"

# War Preparations
FKR_prepare_to_seize_arms:0 "Prepare to Raid Arsenals in the Peninsula"
FKR_prepare_to_seize_arms_desc:0 "Arsenals and supply depots installed throughout the country are poorly guarded. With a well-coordinated attack, we can minimize casualties while seizing weapons, ammunition, and supplies from these arsenals. Given more time and resources, we could raid even more arsenals."
FKR_seize_arms:0 "Commence Arsenal Raid"
FKR_seize_arms_desc:0 "Strike without hesitation! Long live Korean Independence!"
FKR_can_prepare_more_tt:0 "Plans for further arsenal raids are still being prepared.\n"

FKR_national_uprising:0 "National Uprising"
FKR_national_uprising_desc:0 "Despite our technological superiority, we lack the numbers to face the enemy. By persuading our people within the Korean Peninsula, we can steer this war in a more favorable direction.\n"

