#region Equipment DESC
 mechanized_equipment_future_1_desc:0 "The ROK Armed Forces' mechanized infantry divisions have evolved following standard doctrinal developments since the Korean War. Moving through motorized divisions, they increased their armored ratio with the development of K200 APCs and the introduction of K1 tanks. With 2020s-level mechanized infantry receiving transport and fire support from armored vehicles like the K21, they boast overwhelming combat power compared to standard interwar and WWII-era infantry."
 mechanized_equipment_future_2_desc:0 "Mechanized infantry formations possess overwhelming firepower, high combat sustainability, and mobility capable of joint operations with tanks compared to standard infantry units. Armored Personnel Carriers (APCs) or Infantry Fighting Vehicles (IFVs) boarded by modernized mechanized infantry provide a certain level of protection from enemy fire and receive fire support from armored artillery support companies when necessary."
 infantry_equipment_future_1_desc:0 "Facing troop reductions in the 2020s, the ROK Ministry of National Defense determined that individual soldiers' survivability and combat power needed improvement. They proceeded with the Warrior Platform project, leading to innovative improvements in infantry gear through the introduction of integrated combat systems and the distribution of 3rd generation night vision goggles."
 infantry_equipment_future_2_desc:0 "The optical infantry equipment system, developed based on government-led reverse engineering of modern weapons, consists of 4-point bulletproof helmets, tactical body armor, and K-2 RIS automatic rifles with rail systems, maintaining an overwhelming exchange ratio comparable to the Warrior Platform system."
 modern_tank_equipment_future_1_desc:0 "The K-2 Black Panther introduced by the Armed Forces is a ground weapon featuring reinforced composite armor, depleted uranium and improved tungsten shells, an automated fire control system, an integrated battlefield management system, and reactive armor."
 modern_tank_equipment_future_2_desc:0 "Equipped with NBC overpressure protection systems, the modern tank is a versatile and agile vehicle capable of performing many roles, from reconnaissance and support to frontline combat. It features auto-tracking capable of aiming at enemy tanks without missing even while maneuvering over rough terrain, and survivability is greatly enhanced with the introduction of NBC overpressure protection for chemical, biological, and radiological situations and active protection systems."
 modern_tank_aa_equipment_future_1_desc:0 "The combination of anti-air missiles and rapid-fire cannons makes modern anti-aircraft guns a lethal threat to aircraft. This modern equipment seems difficult to produce with current technology levels."
 modern_tank_aa_equipment_future_2_desc:0 "The combination of anti-air missiles and rapid-fire cannons makes modern anti-aircraft guns a lethal threat to aircraft. This redesigned equipment seems feasible to produce smoothly with current technology levels."
 modern_tank_artillery_equipment_future_1_desc:0 "Modern self-propelled artillery vehicles often resemble tanks but generally have armor too light to survive direct artillery combat. However, they provide crew protection against shrapnel and small arms. This modern equipment seems difficult to produce with current technology levels."
 modern_tank_artillery_equipment_future_2_desc:0 "Modern self-propelled artillery vehicles often resemble tanks but generally have armor too light to survive direct artillery combat. However, they provide crew protection against shrapnel and small arms."
 cv_fighter_equipment_future_1_desc:0 "Developed assuming radar electronic warfare, this multi-role fighter adopts a stealth design and is designed to gain air superiority by jamming radars with superior electronic warfare equipment. This fighter is virtually impossible to produce with current technology levels."
 cv_fighter_equipment_future_2_desc:0 "The 4.5th generation fighter, with a fuselage designed for high engine output, afterburners, and high maneuverability, cannot reverse-engineer stealth technology with current era technology. However, judging that there is no problem in seizing air superiority in the current era even without electronic warfare equipment and stealth design due to the technological gap, those designs were boldly excluded during the redesign process."
 cv_CAS_equipment_future_1_desc:0 "The evolving enemy air defense capabilities and interceptors demand the evolution of our close air support aircraft. This new design includes increased engine output, a fuselage with enhanced dive capability and defense, and a larger payload. This modern equipment seems difficult to produce with current technology levels."
 cv_CAS_equipment_future_2_desc:0 "The evolving enemy air defense capabilities and interceptors demand the evolution of our close air support aircraft. This new design includes increased engine output, a fuselage with enhanced dive capability and defense, and a larger payload. This redesigned equipment seems feasible to produce smoothly with current technology levels."
 jet_strat_bomber_equipment_future_1_desc:0 "New designs with multiple jet engines enable unprecedented speeds despite large payloads and long ranges. These aircraft have opened a new era in the history of weapons of mass destruction. This modern equipment seems difficult to produce with current technology levels."
 jet_strat_bomber_equipment_future_2_desc:0 "New designs with multiple jet engines enable unprecedented speeds despite large payloads and long ranges. These aircraft have opened a new era in the history of weapons of mass destruction. This redesigned equipment seems feasible to produce smoothly with current technology levels."
 transport_heli_equipment_1_desc:0 "While standard airplanes have fixed wings or limited movement and are propelled by separate propellers or engines, helicopters fly by rotating the wings themselves with engine power."
 transport_heli_equipment_2_desc:0 "While standard airplanes have fixed wings or limited movement and are propelled by separate propellers or engines, helicopters fly by rotating the wings themselves with engine power. This redesigned equipment seems feasible to produce smoothly with current technology levels."
 attack_heli_equipment_1_desc:0 "It is a military helicopter specialized for combat to attack ground targets such as enemy tanks, armored vehicles, vehicles, buildings, and infantry."
 attack_heli_equipment_2_desc:0 "It is a military helicopter specialized for combat to attack ground targets such as enemy tanks, armored vehicles, vehicles, buildings, and infantry. This redesigned equipment seems feasible to produce smoothly with current technology levels."
 future_anti_tank_equipment_desc:0 "The guided rocket Hyungung (Raybolt), developed by referencing data reverse-engineered from a very small number of Javelins and Panzerfausts found in US military supplies loaded on the Baengnyeongdo, boldly excluded the top-attack function judged unnecessary on the battlefield of the interwar period. Specialized in destroying targets such as armored vehicles, the Hyungung fires armor-piercing rounds in a manner similar to TOW missiles."
 future_anti_air_equipment_desc:0 "The K167 towed vulcan, developed based on data reverse-engineered from the K267 self-propelled anti-aircraft gun, is a low-altitude air defense system developed to partially replace existing expensive guided missiles, which were in excessive demand for shooting down enemy aircraft on the battlefields of the interwar period. It is compatible with low-altitude detection radars operated by the military and is also very effective for counter-fire against ground armored forces."
 future_mlrs_equipment_desc:0 "Multiple Launch Rocket Systems are wide-area suppression weapons capable of inflicting fatal damage not only on enemy armored divisions but also on infantry divisions or artillery units during counterattacks. The wheeled multiple rocket launcher vehicle 'Chunmoo' was designed with the goal of domesticating the US military's M270 MLRS, and its development was possible thanks to researchers from the Agency for Defense Development who were aboard the Gwanggaeto the Great-class destroyers. The interwar MLRS Chunmoo is designed based on the redesigned K2R tank chassis, unlike the future Chunmoo which was wheeled."
 transport_heli_equipment_desc:0 "While standard airplanes have fixed wings or limited movement and are propelled by separate propellers or engines, helicopters fly by rotating the wings themselves with engine power."
 redesigned_transport_heli_equipment_desc:0 "While standard airplanes have fixed wings or limited movement and are propelled by separate propellers or engines, helicopters fly by rotating the wings themselves with engine power."
 attack_heli_equipment_desc:0 "It is a military helicopter specialized for combat to attack ground targets such as enemy tanks, armored vehicles, vehicles, buildings, and infantry."
 redesigned_attack_heli_equipment_desc:0 "It is a military helicopter specialized for combat to attack ground targets such as enemy tanks, armored vehicles, vehicles, buildings, and infantry."
 destroyer_future_1:0 "Modern destroyers must be equipped with various detection technologies and new depth charge drop systems and have a larger displacement than previous generations. This modern equipment seems difficult to produce with current technology levels."
 destroyer_future_2:0 "Modern destroyers must be equipped with various detection technologies and new depth charge drop systems and have a larger displacement than previous generations. This redesigned equipment seems feasible to produce smoothly with current technology levels."
 ship_hull_light_future_1:0 "Modern destroyers must be equipped with various detection technologies and new depth charge drop systems and have a larger displacement than previous generations. This modern equipment seems difficult to produce with current technology levels."
 ship_hull_light_future_2:0 "Modern destroyers must be equipped with various detection technologies and new depth charge drop systems and have a larger displacement than previous generations. This redesigned equipment seems feasible to produce smoothly with current technology levels."
 light_cruiser_future_1:0 "Modern generations of light cruisers used tactically to protect larger ships can handle better air attacks by shaking off the most recent constraints. This modern equipment seems difficult to produce with current technology levels."
 light_cruiser_future_2:0 "Modern generations of light cruisers used tactically to protect larger ships can handle better air attacks by shaking off the most recent constraints. This redesigned equipment seems feasible to produce smoothly with current technology levels."
 ship_hull_cruiser_future_1:0 "Modern generations of light cruisers used tactically to protect larger ships can handle better air attacks by shaking off the most recent constraints. This modern equipment seems difficult to produce with current technology levels."
 ship_hull_cruiser_future_2:0 "Modern generations of light cruisers used tactically to protect larger ships can handle better air attacks by shaking off the most recent constraints. This redesigned equipment seems feasible to produce smoothly with current technology levels."
 carrier_future_1:0 "Through improved construction methods and specialized equipment such as flight deck elevators, this ship can transport more carrier-based aircraft more efficiently. This modern equipment seems difficult to produce with current technology levels."
 carrier_future_2:0 "Through improved construction methods and specialized equipment such as flight deck elevators, this ship can transport more carrier-based aircraft more efficiently. This redesigned equipment seems feasible to produce smoothly with current technology levels."
 ship_hull_carrier_future_1:0 "Through improved construction methods and specialized equipment such as flight deck elevators, this ship can transport more carrier-based aircraft more efficiently. This modern equipment seems difficult to produce with current technology levels."
 ship_hull_carrier_future_2:0 "Through improved construction methods and specialized equipment such as flight deck elevators, this ship can transport more carrier-based aircraft more efficiently. This redesigned equipment seems feasible to produce smoothly with current technology levels."
 submarine_future_1:0 "Increased test diving depth and efficient internal layout will be hallmarks of modern submarines that utilize battlefield experience to use appropriate armament and engines. This modern equipment seems difficult to produce with current technology levels."
