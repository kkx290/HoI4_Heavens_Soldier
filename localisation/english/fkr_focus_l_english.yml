 FKR_gather_information_desc:0 "Strange events have been occurring since the worst magnetic storm since meteorological observations began has cleared. Starting with an urgent report that a skirmish occurred near the 9th Marine Brigade Headquarters garrison with Japanese forces equipped with WWII-level arms and gear, suspicious reports are coming in from all over Jeju Island. We need to gather extensive information about our current situation."
 FKR_contact_prov_gov_desc:0 "According to the information we have gathered, we have concluded that the current timeline is after the Korean Empire was annexed by Japan and the colony was established. Operational plans and logistics reports conducted over the past few days indicate that our current power is insufficient to liberate the Korean Peninsula. If we inform the Provisional Government of the Republic of Korea in exile of our existence, we may be able to receive their assistance."
 FKR_expansion_independent_army_desc:0 "Following contact with the Provisional Government, we must strive to increase the power of the Liberation Army for the independence of our homeland. The current level of the Independence Army seems insufficient to create a regularized military. It is time to draw up plans for the renovation of our military."
 FKR_prepare_independent_desc:0 "There is a need to create an organized single command that transfers the emergency command authority of the current Supreme Commander of the Armed Forces."
 FKR_support_motherland_desc:0 "The Korean Peninsula currently serves as a logistical base for Japan. If we can raid their arsenals, it will be of great help when we conduct operations."
 FKR_operation_gloryday_desc:0 "The tiger's claws are being revealed. On that very day, the cry for freedom that the entire Korean Peninsula shouted, the countless independence activists fighting for independence, the righteous armies rising to restore national sovereignty, and the soldiers of the Armed Forces silently polishing their gun barrels to correct the mistakes of the past fatherland; they all pledge. This will not end with just a shout. Operation Liberation has begun."
 FKR_create_republic_desc:0 "The veterans of the Armed Forces who reclaimed the Korean Peninsula and the Provisional Government are strongly demanding the establishment of a republic. Through a general election, we will establish a republic on the Korean Peninsula where national sovereignty belongs to the people."
 FKR_spirit_of_freedom_desc:0 "The final order we received from the Republic of Korea was to protect liberal democracy. In the current chaotic world situation, we will spread the spirit of liberal democracy to the world."
 FKR_asia_league_desc:0 "The need to launch a so-called 'Freedom Agreement' to save countless people suffering from oppressive rule across Asia and spread liberal democracy to their countries is being publicized by some political officers to demonstrate the superiority of liberal democracy. If public opinion resonates and national efforts are mobilized, the launch of the 'Freedom Agreement', which will influence all of Asia, will be smooth."
 FKR_contact_allies_desc:0 "The political situation in the Asia-Pacific region is heading towards a catastrophe to a degree that cannot be resolved by their efforts alone. We need to look for others abroad to help us."
 FKR_for_the_worker_desc:0 "The driving force of every nation is labor. We must build a nation for the workers."
 FKR_asia_communism_desc:0 "The people of Asia are groaning under imperialist oppression. The launch of the Eurasian Treaty Organization is an opportunity to widely spread the socialist spirit of equality for all, which we possess, throughout the Asian territories."
 FKR_contact_Soviet_russia_desc:0 "The fall of the Soviet Union is foreseen, but the center of communism is currently undoubtedly the Soviet Union. We can provide them with more efficient socialist policy support and future technology, and we will also be able to receive their military assistance."
 FKR_create_empire_desc:0 "The resurrection of the Korean Empire was already foreseen the moment the Expeditionary Fleet traveled back in time. We must proclaim an empire to survive in this chaotic world situation and build a powerful nation."
 FKR_return_of_emperor_desc:0 "Although we built a new nation after the fall of the Korean Empire, there is only one owner of the Korean Peninsula."
 FKR_ask_to_japan_desc:0 "The ill-fated relationship with Japan continued even after leaving a chapter of humiliation in history through the Japanese colonial period, as most soldiers from the future know. It has persisted tenaciously even after our deployed troops traveled through time. Currently, the Japanese Empire is unable to exert its full power due to the war on the Korean Peninsula. Now is the golden opportunity to make them kneel before the name of history."
 FKR_resource_war_desc:0 "East Asia is generally a resource-poor region. It is time to seize resources from other Asian regions to grow our national power."
 FKR_ask_to_china_desc:0 "China is currently unable to function properly as a nation due to rampant corruption. Now seems to be the time to put them under our feet."
 FKR_pressure_manchuria_desc:0 "Gando has always been our territory. We must put pressure on that puppet state currently exercising influence in Manchuria."
 FKR_attack_communism_desc:0 "That huge red nation in the north poses a threat to our national security. The threat of a massive communism is growing from the East."
 FKR_contact_to_axis_desc:0 "We feel a lot of interest and commonality with the new Germany regarding the formation of power based in Europe. If we form an alliance with them, we will gain a friend who is powerful but will not be a rival in Asia, which we rule."
 FKR_removal_warlord_desc:0 "Due to radicals and warlords across the regions, the once glorious empire of China has shattered into pieces and fallen into chaos. The Korean Empire will not tolerate the proliferation of these private armies, not only the warlords but even their vassal states."
 FKR_return_of_king_desc:0 "The time has come for the King to rule the nation directly. That is the only way our empire can stand against Western powers."
 FKR_japan_denno_desc:0 "A new faction has appeared in Japan that wants to seize power and attack the Soviet Union in the north. For the future of the Japanese Emperor and the Empire, we must ensure the dominance of this faction!"
 FKR_qing_dynasty_desc:0 "The time has come to cast off the shackles of oppression and fight for ancient freedom. Manchukuo will be the first piece of China to breathe freely, free from all foreign oppression."
 FKR_royal_society_desc:0 "A single monarchy will not have much influence on the world. It is our turn to create a faction for all monarchies in the world."
 FKR_bourbon_house_desc:0 "The House of Bourbon in France is one of the few great families in Europe. Currently, democracy in France is not functioning properly. Now is the time to show the greatness of the King."
 FKR_old_asia_dynasty_desc:0 "These old Asian dynasties are unable to find their way in the chaotic world situation. We must become their focal point."
 FKR_tzar_desc:0 "Currently, Russia is suffering from the twisted ideology of communism. We must save them."
 FKR_roma_desc:0 "Rome in Italy is worthy of being called the world's greatest power since ancient times, but now it is sick with fascism."
 FKR_kaiserreich_desc:0 "Germany, defeated in World War I, with its King ousted and heavily indebted, cannot be called a proper nation. We must change this situation."
 FKR_carrier_remodeling_desc:0 "Having traveled back to this turbulent era, we need to sort out the equipment and supplies we currently possess."
 FKR_develop_jeju_desc:0 "Jeju Island is the periphery of peripheries, but it is one of the strategic key points. Although the environment is incredibly backward now, if we turn Jeju Island into a logistical base based on our technology, we will be able to defend our power from external threats."
 FKR_national_reconstruction_desc:0 "We have succeeded in reclaiming the mainland, but the war-torn Korean Peninsula has had most of its infrastructure destroyed. We need to deploy heavy equipment to the mainland to restore infrastructure and modernize national facilities."
 FKR_expansion_dockyard_1_desc:0 "Until now, we have been able to preoccupy superior technological advantages over the enemy with modern naval power, but it is true that it is insufficient to confront the powers of the oceans. The shipyard expansion plan will be the foundation for strengthening naval power."
 FKR_expansion_heavy_industry_1_desc:0 "The chronic shortage of defense materials concludes with the sacrifice of soldiers fighting on the front lines. Investment and subsidies for defense contractors, and policies to inspect and improve private military companies will bring about an effect of increasing production capacity."
 FKR_expansion_light_industry_1_desc:0 "Extensive investment in private industries will solve stability in civil administration and chronic unemployment problems. Also, for national infrastructure civil engineering and construction projects, we must conduct large-scale investments in private construction companies."
 FKR_harmony_of_industry_desc:0 "Some key industries are being rebuilt. They are not profitable yet, but they are producing daily necessities needed by the people, which is necessary for the economy to run smoothly. We are slowly opening up many industrial sectors, and only time will tell if this method leads to full recovery."
 FKR_human_resource_development_desc:0 "Our scientific technology is about 80 years ahead of other countries across all fields. By maintaining this 'technology gap', we can preserve our national power and stay ahead."
 FKR_focus_roketry_desc:0 "The KSLV plan is a long-range ballistic projectile development plan being planned based on our cutting-edge technology. Practically, it is close to impossible with the technology of current nations, but it is sufficiently possible with modernized Korean technology, and aims to secure ICBM technology ultimately. Also, we will launch a satellite into Earth's orbit for the first time in human history to exert influence all over the world."
 FKR_focus_electro_tech_desc:0 "As a result of reverse-engineering computers and smartphones brought from the future, computers can now be easily found throughout Korea, and we are producing and consuming various types of computers independently. Until now, it stopped at a low level of semiconductor production, but now is the time to achieve technological progress."
 FKR_expansion_light_industry_2_desc:0 "The government must massively support Korea's private industrial companies to secure competitiveness and prevent technology leakage to foreign countries."
 FKR_focus_atomic_desc:0 "Codename 'Project 890', part of the overall next-generation strategic weapon development plan, was established with the goal of overall nuclear weapon development, including independent development of nuclear reactor technology based on securing uranium or plutonium nuclear warhead technology, securing ICBM technology, and constructing next-generation basic nuclear fusion Tokamak facilities. We will be able to give Dr. Einstein a surprise."
 FKR_develop_resource_desc:0 "The resources of the Korean Peninsula have infinite utility. We must strive to mine them."
 FKR_rumor_of_oil_desc:0 "It is an open secret that there is crude oil in Sinuiju on the Korean Peninsula."
 FKR_sector_7_desc:0 "Sector 7 in the sea south of the Korean Peninsula is a very suitable place to extract crude oil."
 FKR_expansion_reserchteam_desc:0 "The recent massive industrial expansion and reverse-engineering developments may allow for conducting multiple research and developments simultaneously."
 FKR_industrial_company_desc:0 "Enables the use of Industrial Concerns."
 FKR_materiel_company_desc:0 "Enables the use of Materiel Designers."
 FKR_aircraft_company_desc:0 "Enables the use of Aircraft Designers."
 FKR_tank_company_desc:0 "Enables the use of Tank Designers."
 FKR_naval_company_desc:0 "Enables the use of Ship Designers."
 FKR_send_researcher_desc:0 "The establishment of a joint R&D support policy will promote research and development of private companies and maintain the technology gap between domestic and foreign countries by actively supporting independent technology development and infrastructure construction from the technology transfer stage of basic industrial companies."
 FKR_focus_on_current_tech_desc:0 "Future technology is good, but developing modern technology cannot be ignored either."
 FKR_focus_on_future_tech_desc:0 "Modern technology will eventually become obsolete. By investing heavily in future technology, we will enjoy a distinct technological advantage."
 FKR_doctrine_department_desc:0 "The doctrines of the Great War era are worn out. We must deploy the best minds to build the military ideology of tomorrow."
 FKR_army_doc_team_desc:0 "The battlefield has changed not only during the interwar period but also during recent conflicts. We must reflect this and continue to improve our doctrines."
 FKR_focus_small_arms_desc:0 "Instead of imitating or buying foreign equipment, we must become a leader in infantry equipment."
 FKR_focus_support_equipment_desc:0 "Equipment that infantry can carry has continued to evolve. We will focus on presenting the best equipment to our army."
 FKR_focus_artillery_desc:0 "Supporting our brave troops by all means is the key to victory. Whether placing heavy artillery firepower in the rear or providing more direct support on the battlefield, we must ensure our army has everything it needs."
 FKR_focus_mobile_vehicle_desc:0 "By reconsidering the potential of motorized infantry, we can push the limits of vehicles that can be built today."
 FKR_focus_tank_desc:0 "As the superiority of our army appeared, some generals proposed investments in various modernized armored vehicles."
 FKR_future_tank_desc:0 "After much effort, we have made future technology usable at the local level."
 FKR_future_armored_vehicle_desc:0 "After much effort, we have made future technology usable at the local level."
 FKR_navy_doc_team_desc:0 "New naval warfare is expanding its place not only on the sea but also in the air and underwater."
 FKR_focus_destroyer_desc:0 "Modern battleships are excellent, but we must not overlook the crucial role of inferior destroyers in protecting our convoys."
 FKR_future_destroyer_desc:0 "After much effort, we have made future technology usable at the local level."
 FKR_focus_battleship_desc:0 "While theorists argue over air superiority and sea control, no one wants their palace to be the target of a battleship's main guns. Even if carrier proponents eventually prove right, there is no doubt that battleships will still rule the seas for some years."
 FKR_focus_submarine_desc:0 "Combat using submarines is the most amazing naval development since the development of torpedo boats. We can use submarines not only to defend against opponent submarines but also to stop enemy maritime transport."
 FKR_future_submarine_desc:0 "After much effort, we have made future technology usable at the local level."
 FKR_focus_cruiser_desc:0 "We cannot build many capital ships. But if it's cruisers, we can build many and deliver a blow."
 FKR_focus_carrier_desc:0 "Naval theorists have drawn our attention to outdated aircraft carriers. They have made several proposals on how to utilize them if carrier development proceeds in the right direction. True progress cannot be made without our total support."
 FKR_future_carrier_desc:0 "After much effort, we have made future technology usable at the local level."
 FKR_future_cruiser_desc:0 "After much effort, we have made future technology usable at the local level."
 FKR_airforce_team_desc:0 "No area has faster technological progress than air warfare. Aircraft technology is a field that any modern nation must be proficient in."
 FKR_focus_fighter_desc:0 "Innovative civil engineering can improve the speed, range, and maximum altitude of our fighters. We need to focus on this part so as not to fall behind the progress of other countries."
 FKR_focus_navy_bomber_desc:0 "Ships are exceptionally vulnerable to airplanes. We must continue to improve this technology to stay ahead of any countermeasures."
 FKR_focus_CAS_desc:0 "A modernized military needs support not only from ground vehicles but also from the air."
 FKR_future_attack_aircraft_desc:0 "After much effort, we have made future technology usable at the local level."
 FKR_future_multirole_aircraft_desc:0 "After much effort, we have made future technology usable at the local level."
 FKR_focus_tactical_bomber_desc:0 "Victory is achieved by wiping out enemies on the ground. We must focus on supporting our troops by tactically striking close and deep targets."
 FKR_focus_straegy_bomber_desc:0 "Victory is achieved by destroying the enemy's industrial facilities. We must focus on the development and production of strategic bombers."
 FKR_future_bomber_desc:0 "After much effort, we have made future technology usable at the local level."
 FKR_affect_china_desc:0 "Let's deepen the old friendship between us and China. Doing so will alienate Japan, but isn't Japan just the Italy of the East anyway?"
 FKR_affect_japan_desc:0 "Raising the values of liberalism and democracy will pose no threat to our nation at all; rather, it will give us immense strength. We must empower our government to protect these ideals."
 FKR_persuasion_warlord_desc:0 "Some figures in China ignore the central government and refuse to take a side in the struggle. Some of them even harbor dark intentions to secretly sell out the country or conspire with Japan. We must drag those people down."
 FKR_support_japan_civilwar_desc:0 "Before our ideals are thwarted by the authoritarian Japanese government, for the future of our children and our nation, we must launch a preemptive strike."
 FKR_protect_manchu_desc:0 "Manchuria is still under the rule of authoritarians. We must devise a plan to resolve this situation and return the region to legitimate Chinese administration."
 FKR_red_threat_desc:0 "The principles of democracy are incompatible with communism. We must confront this ideology and protect ourselves and those who need us."
 FKR_req_colony_independent_desc:0 "We will take on the role of guardian for all Asian nations in and around the Pacific. Once liberated from Western imperialism, they will need the hand of a leader to guide them into the full-scale development of democracy."
 FKR_support_comm_china_desc:0 "China's central government is corrupt and weak. The communists' desire is to destroy 5,000 years of Chinese history. This situation calls for a great leader who can risk difficult choices for the country, using any means necessary."
 FKR_overthrow_imperialism_desc:0 "It is time to end imperialism. We will become strong by uniting the Asian people, and we will unify the continent under our leadership. Asia for Asians!"
 FKR_red_road_of_asia_desc:0 "The key to achieving true communism is to implement as many of Marx's teachings as possible."
 FKR_red_america_desc:0 "We cannot face the world alone. To protect the revolution, we must utilize Mexico and Cuba as outposts of communism."
 FKR_fall_of_capialism_desc:0 "There is no doubt that the worst obstacle blocking the international revolution is the fat financiers of the United States. Our unchanging priority is to break their solidarity and weaken liberal propaganda."
 FKR_fall_of_fascism_desc:0 "The Nazi regime practiced over the past few years has transformed the government into oppressive, dictatorial, and obviously fascist leaders and supporters. We must eradicate their mindset from the roots."
 FKR_fall_of_royal_house_desc:0 "The time has come to shatter the dominance of the colonialist West. We have waited too long."
 FKR_ancient_korean_literature_desc:0 "According to an ancient Korean text, the Korean people were once the rulers of the greatest empire in history, stretching east to west from the Korean Peninsula to Mesopotamia, and north to south from all of Siberia to Northern India and Central Asia—simply put, dominating most of the Eurasian continent."
 FKR_time_to_reaching_top_desc:0 "The German threat continues to grow. We must crush the German army and force them to bow to their new master."
 FKR_great_britain_desc:0 "The current Britain is doing the insane thing of applying the law to the King. It is time to give them some advice."
 FKR_imperialism_desc:0 "We have spread the spirit of imperialism all over the world. It is time to show the results."
 FKR_power_of_labor_desc:0 "Workers and peasants of the world must cast off their shackles and unite. Shoulder to shoulder, we will build a better future."
 FKR_missionary_of_freedom_desc:0 "Given our nation's foundation and history, we have often been given a mission to act in special situations where the world suffers from inequality and oppression. For the formation of a safe international community, we must export freedom first."
 FKR_expansion_heavy_industry_2_desc:0 "Continuous efforts to expand military factories are needed to keep up with the demand for new equipment."
 FKR_expansion_dockyard_2_desc:0 "The expansion and improvement of shipyards is a major priority for our government. Ports have the best access to manpower and resources, which is why we must concentrate naval facilities there."
 FKR_expansion_dockyard_3_desc:0 "Integrated shipyards will play a major role in building landing crafts and merchant ships."
 FKR_future_small_arms_desc:0 "After much effort, we have made future technology usable at the local level."
 FKR_research_institute_desc:0 "Research cities are marvelous, and possible thanks to the energetic and intelligent brains of citizens. These cities will help build domestic research and industrial bases."
 FKR_inventor_mind_desc:0 "Korean scientists are the world's best, and their military devices are based on the best modern engineering technology."
 FKR_future_self_prop_gun_desc:0 "After much effort, we have made future technology usable at the local level."
 FKR_restoration_old_territory_desc:0 "The land of Manchuria was the territory of ancient Goguryeo. We must strive to restore this land."
 FKR_Establishing_Strat_Ops_Comm_desc:0 "It is time for us to see the big picture regarding war, the nation, and the world situation."
 FKR_Chemical_Weapon_desc:0 "Mustard gas is a cytotoxic blistering agent and a chemical weapon that causes large blisters on exposed skin. Pure sulfur mustard is colorless and exists as a viscous liquid at room temperature, but when used as a chemical agent, it is used in an impure state, appearing yellowish-brown and smelling like mustard, hence the name mustard gas."
 FKR_strat_land_point_desc:0 "Purchasing overseas trade cities and strategic key points will be of great help in future national development."
 FKR_makau_desc:0 "Macau is a peninsular region in South China, smaller than Hong Kong. Although the land is small, considering its trade value, it should never be underestimated."
 FKR_hongkong_desc:0 "Hong Kong is a colony of Western powers and can be said to be the most developed region in South China. Obtaining Hong Kong will certainly not be easy, but if we can have it, nothing would be better."
 FKR_qingdao_desc:0 "Qingdao is a Chinese trade city that can be said to be closest to the Korean Peninsula. Purchasing Qingdao is certainly not a bad choice when considering future relations with China."
 FKR_trade_city_income_desc:0 "If we can generate trade income using these overseas territories we purchased, it will be of great help to national development."
 FKR_passive_diplo_desc:0 "The world situation is chaotic, but it doesn't seem to be significantly related to us."
 FKR_active_diplo_desc:0 "We must attack the enemy before they attack us to survive in this world."
 FKR_3_nation_guarantee_desc:0 "Britain and France are European powers with democratic ideologies. Joining them would be the easiest way to achieve world peace."
 FKR_support_america_desc:0 "The United States of America is currently in an economic mess due to the Great Depression. If we can help them, we can accelerate global democratization."
 FKR_destroy_fascism_desc:0 "Fascist nations should no longer exist on Earth."
 FKR_united_earth_gov_desc:0 "The best way to achieve peace is for one ideology, one government, to rule one Earth. We are ready to achieve this."
 FKR_kor_style_communism_desc:0 "The Western-style communist system does not suit us. We must create our own style of communism."
 FKR_manchu_liberate_desc:0 "The Korean people in the Manchurian region are living in suffering under imperialist oppression. If we can agitate them, it will be of great help in securing Gando."
 FKR_comm_faction_research_desc:0 "Sharing our technology with other communist countries will be very effective in achieving global communization."
 FKR_mexico_bridgehead_desc:0 "Mexico shares a wide border with the United States. If we offer to give them back their old southwestern lands, they will become our ally."
 FKR_attack_usa_desc:0 "In the world we came from, the United States was a blood ally, but times have changed. In expanding our power, the US will be a major threat. We must preemptively strike them before they attack us."
 FKR_spain_king_problem_desc:0 "Due to the impact of the Spanish Civil War, King Alfonso XIII of Spain wishes to go into exile in a foreign country. If we accept his exile, we can gain legitimacy in securing sovereignty over Spanish territory."
 FKR_spain_monarchist_desc:0 "Although Spain is in chaos, there are still royalists who support the King. Supporting them will be of great help in securing Spain."
 FKR_prepair_huge_volunteer_desc:0 "It will be difficult for Spain to support the royalists with its national power alone. We must prepare direct military support."
 FKR_portugal_diplomacy_desc:0 "Portugal is a country we must pass through geographically to support Spain. We should try contacting them."
 FKR_2nd_spain_civil_war_desc:0 "Spain has fallen into an extremely chaotic situation. The people are impoverished, and the government has failed. We must return Spain's land to its owner and help resolve the chaotic situation."
 FKR_destiny_of_spain_desc:0 "Spain has been restored to a monarchy with our help. However, Spain seems to be struggling to survive alone in this chaotic international situation. Now is the time to decide the destiny of Spain."
 FKR_new_entente_desc:0 "The Allied nations, despite winning the war, hold the strange ideology that power should be distributed to the ignorant masses. We must stop this."
 FKR_new_central_desc:0 "The former Central Powers nations were defeated in World War I, and their kings lost their power. We must restore their power."
 FKR_austria_hungary_desc:0 "After World War I, the Austro-Hungarian Empire was divided, and their King lost power. We must restore that power."
 FKR_war_resource_desc:0 "It is true that compared to the amount of resources we currently consume, the resources in our territory are ridiculously insufficient. We must complete a planned and controlled resource supply system to prepare for war by any means necessary."
 FKR_economy_resource_desc:0 "Free trade utilizing our resources will be of great help in developing our economy."
 FKR_additional_army_doc_desc:0 "It is difficult to gain a tactical advantage with a modern doctrine development programs . By developing additional Army doctrine development programs, we will be able to secure a definite tactical advantage."
 FKR_additional_navy_doc_desc:0 "It is difficult to gain a tactical advantage with a modern doctrine development programs . By developing additional navy doctrine development programs, we will be able to secure a definite tactical advantage."
 FKR_additional_airforce_doc_desc:0 "It is difficult to gain a tactical advantage with a modern doctrine development programs . By developing additional air force doctrine development programs, we will be able to secure a definite tactical advantage."
 FKR_chopper_develop_desc:0 "Helicopters don't fly. They simply beat the air into submission."


