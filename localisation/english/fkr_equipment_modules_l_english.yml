#NSB
 future_tank_diesel_engine_1_desc:0 "This is the German diesel engine equipped on the K-2 tank."
 future_tank_hybrid_engine_1_desc:0 "This is the domestic hybrid engine equipped on the K-2 tank."
 future_tank_Composite_Reaction_armor_1_desc:0 "Modular composite + reactive armor prevents failure of external sensors due to explosions and provides protection against KE rounds."
 future_tank_in_arm_suspension_1_desc:0 "The In-arm Suspension Unit (ISU) is fundamentally a suspension structure that combines hydraulic and air suspension."
 future_tank_modern_tank_turret_1_desc:0 "A future modern turret. It uses an electric turret drive system to enable high-precision drive control."
 future_tank_anti_air_cannon_1_desc:0 "The self-propelled anti-aircraft gun equipped on the K-30 Biho."
 future_tank_cannon_1_desc:0 "The 55-caliber 120mm smoothbore cannon equipped on the K-2 tank."
 future_tank_howitzer_1_desc:0 "The 155mm 52-caliber artillery equipped on the K-9 tank. It reaches a maximum range of 40 km."
 future_tank_rocket_launcher_1_desc:0 "A rocket launcher modified for 3.5th generation tanks, originally equipped on the K-239 Chunmoo."
 future_tank_communication_device_1_desc:0 "The digital high-speed wireless communication device allows for the construction of a free independent network between terminals without a base station, providing a great advantage in operational performance."
 future_auto_loader_1_desc:0 "The future autoloader loads shells faster and more rapidly than before."
 future_Active_defense_system_1_desc:0 "The Active Protection System is a system designed to neutralize enemy anti-tank missiles and rocket weapons targeting the tank to improve survivability."
 future_Fire_Control_System_1_desc:0 "The Fire Control System captures target and artillery positions, weather information, etc., to calculate firing data via computer and control the operation of devices related to firing."
 future_Air_conditioner_1_desc:0 "A device that controls the temperature and humidity of indoor air. It improves the internal environment of the tank."
 future_tank_diesel_engine_2_desc:0 "This is the German diesel engine equipped on the K-2 tank."
 future_tank_hybrid_engine_2_desc:0 "This is the domestic hybrid engine equipped on the K-2 tank."
 future_tank_Composite_Reaction_armor_2_desc:0 "Modular composite + reactive armor prevents failure of external sensors due to explosions and provides protection against KE rounds."
 future_tank_in_arm_suspension_2_desc:0 "The In-arm Suspension Unit (ISU) is fundamentally a suspension structure that combines hydraulic and air suspension."
 future_tank_modern_tank_turret_2_desc:0 "A future modern turret. It uses an electric turret drive system to enable high-precision drive control."
 future_tank_anti_air_cannon_2_desc:0 "The self-propelled anti-aircraft gun equipped on the K-30 Biho."
 future_tank_cannon_2_desc:0 "The 55-caliber 120mm smoothbore cannon equipped on the K-2 tank."
 future_tank_howitzer_2_desc:0 "The 155mm 52-caliber artillery equipped on the K-9 tank. It reaches a maximum range of 40 km."
 future_tank_rocket_launcher_2_desc:0 "A rocket launcher modified for 3.5th generation tanks, originally equipped on the K-239 Chunmoo."
 future_tank_communication_device_2_desc:0 "The digital high-speed wireless communication device allows for the construction of a free independent network between terminals without a base station, providing a great advantage in operational performance."
 future_auto_loader_2_desc:0 "The future autoloader loads shells faster and more rapidly than before."
 future_Active_defense_system_2_desc:0 "The Active Protection System is a system designed to neutralize enemy anti-tank missiles and rocket weapons targeting the tank to improve survivability."
 future_Fire_Control_System_2_desc:0 "The Fire Control System captures target and artillery positions, weather information, etc., to calculate firing data via computer and control the operation of devices related to firing."
 future_Air_conditioner_2_desc:0 "A device that controls the temperature and humidity of indoor air. It improves the internal environment of the tank."

