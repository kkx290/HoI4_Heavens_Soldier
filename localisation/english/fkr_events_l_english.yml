 fkr.30.desc:0 "[PER.GetLeader] sent a brief message stating that close relations with [FKR.GetNameDef] are 'not currently a concern of the [PER.GetAdjective] government' and refused to meet with our delegation in Tehran.\n\nWe demanded further clarification, but there is no response."
 fkr.30.a:0 "War is the only solution!"
 fkr.31.title:0 "[FKR.GetNameDef] Wants an Alliance"
 fkr.31.desc:0 "[FKR.GetLeader]'s government has declared support for [FKR.GetNameDef]'s royal coalition. A [FKR.GetNameDef] delegation has arrived to coordinate military assistance plans in wartime situations along with their intention to join our faction."
 fkr.31.a:0 "We will keep our promises."
 fkr.31.b:0 "They are a nuisance."
 fkr.32.title:0 "[JAP.GetNameDef] Rejects Proposal!"
 fkr.32.desc:0 "Negotiations with [JAP.GetNameDef] about joining our faction have broken down. The [JAP.GetNameDef] delegation submitted extensive demands, including promises of widespread military support, as prerequisites for joining our faction.\n\nOperational staff rejected these requirements as they were difficult to meet, and the Ministry of Foreign Affairs believes that [JAP.GetLeader] acted deliberately to reject our proposal without taking responsibility."
 fkr.32.a:0 "How rude!"
 fkr.33.title:0 "[FKR.GetNameDef] Wants an Alliance"
 fkr.33.desc:0 "[FKR.GetLeader]'s government has declared support for [FKR.GetNameDef]'s royal coalition. A [FKR.GetNameDef] delegation has arrived to coordinate military assistance plans in wartime situations along with their intention to join our faction."
 fkr.33.a:0 "We will keep our promises."
 fkr.33.b:0 "They are a nuisance."
 fkr.34.title:0 "[MAN.GetNameDef] Rejects Proposal!"
 fkr.34.desc:0 "Our recent aggressive diplomacy has resulted in a cold refusal from [MAN.GetNameDef]. Before the parliamentary speech, [MAN.GetLeader] stated in response to questions about guarantees for [FKR.GetNameDef] that 'it will be decided when irrelevant events occur'."
 fkr.34.a:0 "We have no choice."

 fkr.35.title:0 "Restoration of Monarchy in Neighboring Country"
 fkr.35.desc:0 "The leader of [From.GetNameDef], [From.GetLeader], has accepted our advice and announced that their country has returned to a monarchy."
 fkr.35.a:0 "Good news."

 fkr.36.title:0 "Monarchy Joining Faction"
 fkr.36.desc:0 "The leader of [From.GetNameDef], [From.GetLeader], has accepted our proposal and expressed their intention to join us in this chaotic world situation."
 fkr.36.a:0 "Good news."

 fkr.37.title:0 "Generals Support the Government"
 fkr.37.desc:0 "Since the Annexation of Korea in 1910, Joseon has acted as a puppet state of the Japanese Empire. High-ranking officials in the Japanese Government-General of Korea were largely Japanese, and local figures faced much suppression. As the Korean Peninsula became independent due to our struggle, generals from the region associated with the military have expressed their intention to join our government.\n\nAlso, members of the former Korean Empire's royal family have returned from Japan and expressed their support and desire to help our government."
 fkr.37.a:0 "They will be stepping stones for the future!"
 fkr.37.a.tt:0 "2 Field Marshals will appear. \n15 Generals will appear. \nThe decision to employ royals as generals is unlocked."

 fkr.38.title:0 "[FKR.GetNameDef] Betrays Us!"
 fkr.38.desc:0 "[FKR.GetNameDef] has left our faction and is preparing to declare war on us! We must prepare to respond to them."
 fkr.38.a:0 "I knew it!"

 fkr.39.title:0 "[FKR.GetNameDef] Expels Us from Faction!"
 fkr.39.desc:0 "[FKR.GetNameDef] has expelled us from their faction and seems to be preparing for war with us. We must respond to them swiftly!"
 fkr.39.a:0 "Bastards!"

 fkr.40.title:0 "[FKR.GetNameDef]'s Invitation to Faction"
 fkr.40.desc:0 "We are officially being pressured by [FKR.GetNameDef] to join their faction. Should we accept?"
 fkr.40.a:0 "Yes, let's join."
 fkr.40.b:0 "No, we haven't reached our full potential yet!"

 fkr.41.title:0 "[CHI.GetNameDef]'s Acceptance"
 fkr.41.desc:0 "Our overwhelming forces concentrated on their border persuaded the [CHI.GetNameDef] government to accept our humble request for border revision. We have gained control of the Chinese mainland, and the position of the Korean Peninsula is now much more secure."
 fkr.41.a:0 "Good news."

 fkr.42.title:0 "[CHI.GetNameDef]'s Refusal"
 fkr.42.desc:0 "The [CHI.GetNameDef] government rejected our demands, but this was expected. If we want democracy, we will take it by force. It is time to teach the stubborn Chinese an unforgettable lesson."
 fkr.42.a:0 "For democracy! War!"
 fkr.42.b:0 "We cannot force them."

 fkr.43.title:0 "[From.GetNameDefCap] Wants Control of Our Colony"
 fkr.43.desc:0 "[Root.GetAdjective], taking advantage of our weakness, has proposed to 'help' maintain 'order' in our colony. They commented that our homeland has fallen and there is no possibility of maintaining this place.\n\nThis must be a ploy to manipulate our colony, but what choice should we make?"
 fkr.43.a:0 "Time to accept Korean dominance in the East."
 fkr.43.b:0 "You will have to take it by force!"
 fkr.44.title:0 "[From.GetNameDefCap] Approved Control of Colony"
 fkr.44.desc:0 "[From.GetNameDefCap] has considered our proposal for 'maintaining order' in the colony and decided to approve it. They will transfer all control to us."
 fkr.44.a:0 "Wise choice."
 fkr.45.title:0 "[From.GetNameDefCap] Rejected Control of Colony"
 fkr.45.desc:0 "[From.GetNameDefCap] has considered our proposal for 'maintaining order' in the colony and decided to reject it."
 fkr.45.a:0 "We must find a way to instigate."
 
 fkr.46.title:0 "[FKR.GetNameDef]'s Proposal"
 fkr.46.desc:0 "Having split from the Kuomintang to liberate the people, we must now join the existing faction of [FKR.GetNameDef] to prevent separatist movements. China's enemies have always relied on weakening us through internal strife; the new socialist state will not make that mistake!"
 fkr.46.a:0 "A good proposal."
 fkr.46.b:0 "Not worth thinking about."

 fkr.47.title:0 "People's Republic Revolutionaries Accept Proposal"
 fkr.47.desc:0 "Chinese revolutionaries who overthrew Kuomintang control and agree with our cause have decided to join our nation under the leadership of [PRC.GetLeader]. From now on, it shall be a unified People's Republic of China."
 fkr.47.a:0 "Good news!"

 fkr.48.title:0 "[PRC.GetNameDef]'s Refusal"
 fkr.48.desc:0 "[PRC.GetNameDef] seems to be heading towards self-destruction, and the fools in that government are refusing our troops passage through their territory. Do they think they would be better off under the Republic of China? Their selfish leaders are committing a crime against the people by denying them true socialism."
 fkr.48.a:0 "Then it's war!"

 fkr.49.title:0 "[FKR.GetNameDef]'s Pressure for Gando Integration"
 fkr.49.desc:0 "Civil unrest and acts of violence have occurred due to the voices of protesters desiring Manchuria to join [FKR.GetNameDef]. [FKR.GetNameDef] envisions seeing Manchuria annexed into their country and has pushed harder for Manchurian reform to annex Manchuria into [FKR.GetNameDef]."
 fkr.49.a:0 "We must become one with [FKR.GetNameDef]!"
 fkr.49.b:0 "No, Manchukuo's destiny lies elsewhere."
 
 fkr.50.title:0 "Integration of Gando"
 fkr.50.desc:0 "According to the Gando Convention signed by Japan and the Qing Dynasty completely ignoring the former Korean Empire government, the land of Gando, Korea's old territory, currently belongs to Manchuria. However, Koreans in this region wish to return to the embrace of their proud homeland, not just belong to a peripheral province of China. Naturally, we will embrace them in accordance with the principle of self-determination. No matter what anyone says, Gando is the land of the Korean people."
 fkr.50.a:0 "Who can say that Gando is not the land of the Korean people!?"

 fkr.51.title:0 "Manchukuo Refuses Gando Integration!"
 fkr.51.desc:0 "The fools in Changchun have refused to accept the annexation of our two countries! This is an intolerable act that blatantly ignores the will of the Manchukuo people! We may have to use military means to enforce annexation."
 fkr.51.a:0 "We must prepare for military intervention."

 fkr.52.title:0 "[FKR.GetNameDef] Proposing Guarantee of Independence"
 fkr.52.desc:0 "Following recent dramatic political shifts in East Asia, the issue of relations with [FKR.GetNameDef] is constantly being raised. Today, the ambassador of [FKR.GetNameDef] submitted an official document demanding a formal stance towards the Empire. The Imperial family of [FKR.GetNameDef] claims that Japan, the land of the old royal family, belongs to them.\n\nHowever, [FKR.GetLeader] specified a compromise where he would become the titular head of state with minimal power in our country."
 fkr.52.a:0 "Return to Empire."
 fkr.52.b:0 "Accept the compromise."
 fkr.52.c:0 "We will not trade freedom for security!"

 fkr.53.title:0 "Return of the Japanese Throne"
 fkr.53.desc:0 "After discussions among high-ranking officials lasting late into the night, the [JAP.GetAdjective] government decided to accept the proposal and proclaimed [FKR.GetLeader] as the Emperor of Japan. Former Japanese soldiers swore allegiance to the new King and Emperor, and civil administrative districts were fully integrated."
 fkr.53.a:0 "Another step towards reclaiming our birthright."

 fkr.54.title:0 "Japan Agrees to Close Relations"
 fkr.54.desc:0 "After discussions among high-ranking officials lasting late into the night, [JAP.GetLeader] chose a compromise. It will be proclaimed that [FKR.GetLeader] will become the King of Japan, but the [JAP.GetAdjective] Constitution will limit his power to be exercised only with the advice and consent of the Diet."
 fkr.54.a:0 "Acceptable."

 fkr.55.title:0 "[JAP.GetNameDefCap] Refuses Progress"
 fkr.55.desc:0 "[JAP.GetNameDefCap] refused to accept any settlement or agreement regarding future relations with us. When our ambassador arrived at the Foreign Ministry to discuss the previously delivered official document, he was told there was nothing to discuss and was hurriedly ushered out. The [JAP.GetAdjective] ambassador notified that while they desire peace and friendship, there is no possibility of [JAP.GetNameDef] being integrated into [FKR.GetNameDef]."
 fkr.55.a:0 "Regrettable."
 
 fkr.56.title:0 "[FKR.GetNameDef] Proposing Guarantee of Independence"
 fkr.56.desc:0 "Following recent dramatic political shifts in East Asia, the issue of relations with [FKR.GetNameDef] is constantly being raised. Today, the ambassador of [FKR.GetNameDef] submitted an official document demanding a formal stance towards the Republic. The Imperial family of [FKR.GetNameDef] claims that the Central Plains, the land of the old royal family, belong to them.\n\nHowever, [FKR.GetLeader] specified a compromise where he would become the titular head of state with minimal power in our country."
 fkr.56.a:0 "Integrated into the Empire."
 fkr.56.b:0 "Accept the compromise."
 fkr.56.c:0 "We will not trade freedom for security!"

 fkr.57.title:0 "Return of the Chinese Throne"
 fkr.57.desc:0 "After discussions among high-ranking officials lasting late into the night, the [CHI.GetAdjective] government decided to accept the proposal and proclaimed [FKR.GetLeader] as the Celestial Emperor of China. Former Chinese soldiers swore allegiance to the new King and Emperor, and civil administrative districts were fully integrated."
 fkr.57.a:0 "Another step towards reclaiming our birthright."

 fkr.58.title:0 "China Agrees to Close Relations"
 fkr.58.desc:0 "After discussions among high-ranking officials lasting late into the night, [CHI.GetLeader] chose a compromise. It will be proclaimed that [FKR.GetLeader] will become the King of China, but the [CHI.GetAdjective] Constitution will limit his power to be exercised only with the advice and consent of the Diet."
 fkr.58.a:0 "Acceptable."

 fkr.59.title:0 "[CHI.GetNameDefCap] Refuses Progress"
 fkr.59.desc:0 "[CHI.GetNameDefCap] refused to accept any settlement or agreement regarding future relations with us. When our ambassador arrived at the Foreign Ministry to discuss the previously delivered official document, he was told there was nothing to discuss and was hurriedly ushered out. The [CHI.GetAdjective] ambassador notified that while they desire peace and friendship, there is no possibility of [CHI.GetNameDef] being integrated into [FKR.GetNameDef]."
 fkr.59.a:0 "Regrettable."

 fkr.60.title:0 "Operation Order 393"
 fkr.60.desc:0 "The Combined Forces Command has decided to reorganize some of the infantry assault divisions under the Ground Operations Command and carrier-based assault helicopters into a new helicopter airborne unit for future mainland advance operations. Most army troops embarked on ships and one marine regiment will be assigned to the newly created division. Also, in the process of reclassifying military supplies and administrative processing, it was concluded that there is a limit to consuming the equipment and supplies we currently have, and it is unreasonable to reproduce equipment with current technology. National-scale redesign and development seem necessary to smoothly supply modern-level equipment."
 fkr.60.a:0 "That's a shame..."

 fkr.61.title:0 "Report on Independence Fighter of Japanese Origin"
 fkr.61.desc:0 "When we occupied Tokyo, we were able to secure many documents related to the Independence Army. One notable report surprisingly stated that there was a military-related figure suspected of being a Liberation Army soldier of Japanese origin. Should we look for the person related to this report?"
 fkr.61.a:0 "Incomprehensible, but let's look for him."
 fkr.61.b:0 "Meaningless. No time for that."

 fkr.62.title:0 "Independence Fighter Found in Burma"
 fkr.62.desc:0 "We were able to find a Japanese man at the border between Myanmar and Burma. Surprisingly, he claimed to be acting as a secret envoy for the Liberation Army for Korea's independence and conducting sabotage within the Japanese military. He also introduced himself as Mutaguchi Renya. He said he was personally chasing a civilian in strange attire recently. However, he lost track of that civilian recently and heard news after asking around that the civilian headed to Anatolia, Turkey. Should we investigate this case further?"
 fkr.62.a:0 "This case is worth investigating further."
 fkr.62.b:0 "He is talking nonsense."

 fkr.63.title:0 "Sivas Found in Sivas"
 fkr.63.desc:0 "We were able to find a civilian from our timeline in Sivas, a region in Turkey. This civilian claimed to have teleported by an unknown force and introduced himself as a streamer who broadcasted on YouTube and Twitch. It seems unbelievable, but judging by his attire and speech, it seems to be true. He also said there was another streamer who traveled through time with him. Should we set out to find this other civilian?"
 fkr.63.a:0 "We must wrap up this case."
 fkr.63.b:0 "No further investment."

 fkr.64.title:0 "TRY RE Found in Berlin"
 fkr.64.desc:0 "Similar to what happened in Sivas, Turkey, we met a man in modern attire in Berlin, Germany. He also revealed himself to be a streamer broadcasting on YouTube, like Sivas. We asked a few questions, but did not get any particularly interesting information."
 fkr.64.a:0 "Let's hope this is the end..."

 fkr.65.title:0 "Uprising in Hoseo and Gwandong Regions"
 fkr.65.desc:0 "The enemy has incited our good citizens in the Hoseo and Gwandong regions to defect to them without our knowledge. We must quickly devise countermeasures!"
 fkr.65.a:0 "It's still okay..."

 fkr.66.title:0 "Uprising in Gyeonggi and Haeseo Regions"
 fkr.66.desc:0 "Following the previous uprisings, successive popular uprisings have occurred in the Gyeonggi and Haeseo regions. An unknown explosion suspected to be terrorism occurred at the Government-General in Gyeongseong overnight. It seems increasingly difficult to maintain the regime."
 fkr.66.a:0 "We can retreat no further."

 fkr.67.title:0 "Fall of the Colonial Government"
 fkr.67.desc:0 "An uprising supporting the Independence Army has occurred even in the northern regions of the Korean Peninsula, where we held the last control. It seems we can no longer maintain the government, and it appears we will soon be integrated into the Provisional Government."
 fkr.67.a:0 "Is this the end?"

 fkr.68.title:0 "Uprising in Hoseo and Gwandong Regions"
 fkr.68.desc:0 "We have successfully recruited local volunteer armies in the Hoseo and Gwandong regions. We must use this opportunity to drive the enemies out of the southern Korean Peninsula."
 fkr.68.a:0 "Take it slow."

 fkr.69.title:0 "Uprising in Gyeonggi and Haeseo Regions"
 fkr.69.desc:0 "We were able to incite volunteer armies even in Gyeongseong, the heart of the Korean Peninsula. As soon as the operation order was issued, an explosion occurred at the Japanese Government-General building in front of Gyeongbokgung Palace, and the colonial army is suffering unbearable damage. The dream of independence is approaching reality."
 fkr.69.a:0 "Their downfall is imminent."

 fkr.70.title:0 "Fall of the Colonial Government"
 fkr.70.desc:0 "We were able to take even the last northern region of the Korean Peninsula controlled by the colonial army. The colonial army was quickly disarmed by our forces, and control of the Korean Peninsula has completely fallen into our hands."
 fkr.70.a:0 "It's finally over."

 fkr.71.title:0 "Korea's Proposal for Tripartite Defense Agreement"
 fkr.71.desc:0 "[From.GetNameDefCap] is sounding us out to confirm the true intentions of us, [FKR_initiator.GetAdjective], and [FRA_democratic.GetAdjective] regarding the Tripartite Defense Agreement. [FKR_initiator.GetAdjective] tried to persuade us that mutual support is natural against the increasingly hostile international situation regarding our efforts."
 fkr.71.a:0 "Excellent idea. We will sign the treaty."
 fkr.71.b:0 "No, we cannot risk facing the whole world."

 fkr.72.desc:0 "[FKR_initiator.GetNameDefCap] is sounding us out to confirm the true intentions of us, [FKR_initiator.GetAdjective], and [ENG_democratic.GetAdjective] regarding the Tripartite Defense Agreement. [FKR_initiator.GetAdjective] tried to persuade us that mutual support is natural against the increasingly hostile international situation regarding our efforts. [ENG_democratic.GetAdjective] has already affirmed support for the idea."

 fkr.73.title:0 "Signing of Tripartite Defense Agreement"
 fkr.73.desc:0 "The governments of [ENG_democratic.GetAdjective] and [FRA_democratic.GetAdjective] have accepted the signing of the Tripartite Defense Agreement and will stand on our side in wartime."

 fkr.74.title:0 "[From.GetNameDefCap] Rejects Tripartite Defense Agreement"
 fkr.74.desc:0 "The [From.GetAdjective] government refused to sign the Tripartite Defense Agreement and will go alone without interference."

 fkr.75.title:0 "[From.GetNameDefCap] Signs Tripartite Defense Agreement"
 fkr.75.desc:0 "The [FRA_democratic.GetAdjective] government accepted the signing of the Tripartite Defense Agreement and will stand on our side in wartime."

 fkr.76.title:0 "Economic Aid to [USA.GetNameDef]"
 fkr.76.desc:0 "[USA.GetNameDef]'s economic structure is in a dangerous situation due to the Great Depression they have been suffering since 1929. By helping them, we will be able to secure a powerful ally in the future. However, providing economic aid will also have a negative impact on our economy for the time being."
 fkr.76.a:0 "Excellent idea. Let's support [USA.GetNameDef]."
 fkr.76.b:0 "No, they have nothing to do with us."

 fkr.77.title:0 "[FKR.GetNameDef]'s Proposal for Economic Aid"
 fkr.77.desc:0 "[FKR.GetNameDef]'s leader [FKR.GetLeader] has proposed aid for our recently stagnant economy."
 fkr.77.a:0 "Excellent proposal. Let's accept their support."
 fkr.77.b:0 "Untrustworthy nation. Refuse."

 fkr.78.title:0 "[USA.GetNameDef] Accepts Aid"
 fkr.78.desc:0 "[USA.GetNameDef]'s leader [USA.GetLeader] accepted our proposal for economic aid and expressed great gratitude for this help."
 fkr.78.a:0 "I knew it."

 fkr.79.title:0 "[USA.GetNameDef] Refuses Aid"
 fkr.79.desc:0 "[USA.GetNameDef]'s leader [USA.GetLeader] refused our proposal for economic aid."
 fkr.79.a:0 "Stupid Yankees."

 fkr.80.title:0 "Civil War!"
 fkr.80.desc:0 "After the military threatened to restrict the people's dignified rights once again, the communist forces in the government launched a surprise attack on the state. Surprisingly quickly, a significant portion of the army took up arms to defend the people and their rights to freedom.\n\nThis military split allowed the people's representatives to seize power in the legislature and executive branches. The civil war has just begun, but the rebel government does not seem likely to yield easily."
 fkr.80.a:0 "Protect the Emperor!"

 fkr.81.title:0 "Civil War in Manchuria"
 fkr.81.desc:0 "The coup in the Manchurian region executed by our operatives proceeded smoothly, and the government of [MAN.GetNameDef] is collapsing. We can help the coup forces in [MAN.GetNameDef] under the pretext of protecting Koreans in the Manchurian region."
 fkr.81.a:0 "We've been waiting for this moment!"
 fkr.81.b:0 "We cannot afford to help them."

 fkr.82.title:0 "Entente or Central Powers, That is the Question!"
 fkr.82.desc:0 "Our efforts to popularize the monarchical political system in Asia are proceeding surprisingly smoothly. But we cannot be satisfied with just our Asia. We must pay attention to Europe, where World War I occurred. The threat of another World War is approaching in Europe. Now we must look for the European kings who have lost power and the countries that will stand with us."
 fkr.82.a:0 "Side with the Entente nations."
 fkr.82.b:0 "Side with the Central Powers nations."

 fkr.83.title:0 "Austria-Hungary Issue"
 fkr.83.desc:0 "The Austro-Hungarian Empire, defeated in World War I, is currently divided into two countries, Austria and Hungary, walking separate paths. We contacted Otto von Habsburg, the legitimate heir of the Austro-Hungarian Empire, and asked him to ascend the throne again for a new Austro-Hungarian Empire. All that remains is to ask which country will join our cause."
 fkr.83.a:0 "Contact Austria."
 fkr.83.b:0 "Contact Hungary."

 fkr.84.title:0 "Invitation to Restore Monarchy from East Asia"
 fkr.84.desc:0 "[FKR.GetNameDef], rising as a new power in Northeast Asia, has made a proposal to us for the restoration of a new Austro-Hungarian Empire. How should we answer?"
 fkr.84.a:0 "An attractive proposal."
 fkr.84.b:0 "They are insane."

 fkr.85.title:0 "Invitation to Restore Monarchy from East Asia"
 fkr.85.desc:0 "[FKR.GetNameDef], rising as a new power in Northeast Asia, has made a proposal to us for the restoration of a new Austro-Hungarian Empire. How should we answer?"
 fkr.85.a:0 "An attractive proposal."
 fkr.85.b:0 "They are insane."

 fkr.86.title:0 "Resurrection of the Austro-Hungarian Empire!"
 fkr.86.desc:0 "We have placed the core regions of the former Austro-Hungarian Empire back under our control. It is time to announce the return of the Austro-Hungarian Empire to the world."
 fkr.86.a:0 "For our new empire!"

 fkr.87.title:0 "Uralsky Found in the Ural Mountains"
 fkr.87.desc:0 "In this desolate land, we found another civilian who traveled through time. He says he came here during his military service."

 fkr.88.title:0 "Yong-nom Found in Lyon"
 fkr.88.desc:0 "In Lyon, France, we found a young-looking time-traveling civilian. He says he just turned 20 after finishing his college entrance exams."

 fkr.89.title:0 "A Wild Developer Appeared!"
 fkr.89.desc:0 "You found me through a 10 percent chance. Please treat me well."
 fkr.89.a:0 "Okay."

 fkr.90.title:0 "Secret Agreement with [MEX.GetNameDef]"
 fkr.90.desc:0 "The American continent and the Asian continent have a geographical feature that makes round trips difficult due to the huge Pacific Ocean in between. The most important thing for us in conquering the American continent is finding a country to serve as a logistical base. If we propose to Mexico that we return the vast territory they had in 1825, which has now been taken by [USA.GetNameDef], they will undoubtedly accept our alliance request."
 fkr.90.a:0 "Good idea."
 fkr.90.b:0 "We don't need their help."

 fkr.91.title:0 "Proposal from East Asia"
 fkr.91.desc:0 "A proposal has come from the newly born [FKR.GetNameDef] across the Pacific to return our vast old territory of 1825 in exchange for an alliance. What should we tell them?"
 fkr.91.a:0 "An offer we can't refuse."
 fkr.91.b:0 "They are insane!"

 fkr.92.title:0 "[MEX.GetNameDef] Accepts Proposal"
 fkr.92.desc:0 "[MEX.GetNameDef] seemingly found our proposal satisfactory and decided to become our ally."
 fkr.92.a:0 "The American continent will soon be ours."

 fkr.93.title:0 "[MEX.GetNameDef] Rejects Proposal"
 fkr.93.desc:0 "[MEX.GetNameDef] seems to think that we do not have the national power to control the American continent. They rejected our proposal."
 fkr.93.a:0 "Then let's show them our power!"

 fkr.94.title:0 "[MEX.GetNameDef] Demands Fulfillment of Agreement"
 fkr.94.desc:0 "[MEX.GetNameDef] is demanding their old territory lost in 1825. We could respect them... or discard them now that they are useless..."
 fkr.94.a:0 "We do not break our promises."
 fkr.94.b:0 "We don't need them anymore."

 fkr.95.title:0 "[FKR.GetNameDef] Fulfills Territory Cession"
 fkr.95.desc:0 "[FKR.GetNameDef] has fulfilled the territory cession agreement."
 fkr.95.a:0 "A trustworthy ally indeed."

 fkr.96.title:0 "[FKR.GetNameDef] Fails to Cede Territory"
 fkr.96.desc:0 "This insane nation did not keep their promise to us. If we don't attack them now, it is clear that we will be the next target!"
 fkr.96.a:0 "Strike without hesitation!"

 fkr.97.title:0 "[FKR.GetNameDef]'s Alliance Proposal"
 fkr.97.desc:0 "[FKR.GetNameDef] has recently proposed the unity of communist bloc nations under the growing threat of imperialism and capitalism in Asia."
 fkr.97.a:0 "Stronger together."
 fkr.97.b:0 "We don't need them."

 fkr.98.title:0 "[PRC.GetNameDef] Joins Alliance"
 fkr.98.desc:0 "[PRC.GetNameDef] has decided to join us to overthrow the growing imperialism and capitalism in Asia."
 fkr.98.a:0 "For the people!"

 fkr.99.title:0 "[PRC.GetNameDef] Ignores Proposal"
 fkr.99.desc:0 "[PRC.GetNameDef] ignored our proposal urging communist unity and recklessly decided to navigate this chaotic era alone."
 fkr.99.a:0 "If words don't work, what then?"

 fkr.100.title:0 "Spanish King Issue"
 fkr.100.desc:0 "After the recent civil war in [SPR.GetNameDef], their deposed king 'Alfonso XIII' has requested asylum in our country. In the long term, he is thinking of returning to the Spanish throne, and seems to think he needs our help for this."
 fkr.100.a:0 "Welcome him warmly."
 fkr.100.b:0 "Deport him immediately."

 fkr.101.title:0 "[FKR.GetNameDef]'s Pressure"
 fkr.101.desc:0 "Recently, [FKR.GetNameDef] is demanding military access from us, a border country of [SPR.GetNameDef], for the restoration of Spain's 'Alfonso XIII'."
 fkr.101.a:0 "Grant them access."
 fkr.101.b:0 "Access alone is not enough, negotiate an alliance with them!"
 fkr.101.c:0 "That will not happen."

 fkr.102.title:0 "[POR.GetNameDef] Grants Military Access"
 fkr.102.desc:0 "[POR.GetNameDef] readily accepted our demand for military access for the restoration of [SPR.GetNameDef]'s throne. Our door to Europe is wide open!"
 fkr.102.a:0 "Good news!"

 fkr.103.title:0 "[POR.GetNameDef] Proposes Military Alliance"
 fkr.103.desc:0 "Surprisingly, [POR.GetNameDef] proposed a military alliance to us beyond just military access. Their territory will be an excellent starting point for us to exert influence in Europe."
 fkr.103.a:0 "Unexpected news!"

 fkr.104.title:0 "[POR.GetNameDef] Ignores Request"
 fkr.104.desc:0 "[POR.GetNameDef] failed to see the flow of the times and conveyed that they will never join us. We might not need their help, but we cannot tolerate our nation being ignored."
 fkr.104.a:0 "Stupid fools..."

 fkr.105.title:0 "Royalist Coup"
 fkr.105.desc:0 "Shortly after we ended the civil war, royalists staged another coup. They are demanding the restoration of 'Alfonso XIII' and do not seem likely to yield to us easily."
 fkr.105.a:0 "Teach them a lesson!"

 fkr.106.title:0 "Destiny of Spain"
 fkr.106.desc:0 "Spain has returned to a monarchy with our help, but their country is devastated by two consecutive civil wars and the government is chaotic. We can make them our ally, make them our puppet, or annex them completely."
 fkr.106.a:0 "They will be a sovereign nation."
 fkr.106.b:0 "Puppet them."
 fkr.106.c:0 "A nation with no hope. Annex them."

 ################################################################################################################ -<

 kor.1.title:0 "Unknown Attack"
 kor.1.desc:0 "We are under attack by an unknown military organization in the southern Korean Peninsula. It is said to be not just a simple raid but combat power at the level of a systematically organized military. Rumors say they possess unbelievable technology and have proclaimed that they hold legitimate sovereignty over the Korean Peninsula."
 kor.1.a:0 "Unbelievable! Mobilize the army immediately."
 
 ################################################################################################################ -<
 fkr_news.1.title:0 "Rise of [From.GetNameDef]"
 fkr_news.1.desc:0 "Many military experts around the world were perplexed by [From.GetOldAdjectiveCap] superiority, but the results speak for themselves. In just a few years, the Korean Empire completely conquered Asia, reclaimed Manchuria, and crushed all resistance against the Korean Empire in Asia.\n\nTo inspire national pride, the [From.GetOldAdjectiveCap] government used historical continuity to embellish their military achievements as the 'Reconstruction of the Hwandan State against Korean Invaders'. As part of this propaganda, a lavish ceremony was held in the middle of the newly renamed capital of the Hwandan Empire, and [From.GetOldNameDef] announced that it would officially change its name to '[From.GetNameDef]'."
 fkr_news.1.a:0 "Let the reconquest begin."
 fkr_news.1.b:0 "Miraculous reversal of fate..."
 fkr_news.1.c:0 "It won't last long!"
 
 fkr_news.2.title:0 "[FKR.GetNameDefCap] Assumes Control of [From.GetAdjective] Colonies"
 fkr_news.2.desc:0 "With [From.GetNameDef] currently weakened, it is not particularly surprising that [FKR.GetAdjective] is pressuring for jurisdiction over East Asian territories occupied by [From.GetAdjective]. Meanwhile, this morning, an official envoy of the [From.GetAdjective] government made the surprising announcement that control of [From.GetAdjective] colonies would be immediately transferred to [FKR.GetNameDef]."
 fkr_news.2.a:0 "Asia for Asians!"
 fkr_news.2.b:0 "A sad day for Europe..."
 fkr_news.2.c:0 "Is this the end of colonialism?"

 fkr_news.3.title:0 "Annexation of Gando in Manchuria"
 fkr_news.3.desc:0 "Following a successful coup staged by local ethnic groups in [From.Root.GetNameDef], Korean troops crossed the border and took control of the country.\n\nKorean soldiers who rushed to intervene in [From.Root.GetAdjective] civil war were welcomed by crowds in the cities. [FKR.GetLeader] announced the integration of Gando in Manchuria and emphasized:\n\n'The struggle between ethnic groups will end soon! The people of the northern region of old Korea will now become a fortress of the new [FKR.GetNameDef]!'"
 fkr_news.3.a:0 "If that is their wish..."
 fkr_news.3.b:0 "Welcome to the Empire!"
 fkr_news.3.c:0 "Unbelievable, that place is our land!"

 fkr_news.4.title:0 "War of Independence in Korea"
 fkr_news.4.desc:0 "After an eternity since Japan annexed the Korean Empire in 1910, the Korean Peninsula has turned into a battlefield due to a civil war led by Korean independence fighters. The Japanese Empire defined the independence activities of the independence fighters as terrorism and expressed its position to actively intervene in the civil war occurring on the Korean Peninsula.\n\nHowever, rumors say that guerrilla organizations seeking independence from Japanese oppression are sporadically attacking government forces, and the independence fighters are known to be fighting alongside a group armed with unbelievable levels of modern technology."
 fkr_news.4.a:0 "Let's hope it doesn't affect us..."
 fkr_news.4.b:0 "Now is the time to act."
 fkr_news.4.c:0 "We must prepare for war immediately."

 fkr_news.5.title:0 "Declaration of Monarchy Restoration"
 fkr_news.5.desc:0 "Through political turmoil, the people of [From.GetName] feel they have not yet recovered what was lost in the last World War. The [From.GetAdjective] elite embarked on the reconstruction of the [From.GetAdjective] royal family and the restoration of [From.GetAdjective] greatness.\n\nThese political reforms strengthened the power of the nation and the military, and the [From.GetAdjective] people became convinced of the feats promised by [From.GetLeader]. Also, [From.GetName] announced that it would join the faction led by [FKR.GetLeader], the King of [FKR.GetNameDef], who greatly helped in the restoration of the monarchy."
 fkr_news.5.a:0 "A King in this era?!"
 fkr_news.5.b:0 "Another group of friends."

 fkr_news.6.title:0 "Japanese Revolution Outbreak!"
 fkr_news.6.desc:0 "Japanese soldiers and citizens with a conscience have risen up in unison to defeat the fascist regime that lost the people's trust due to corruption and incompetence, and to revive a new Japan with the spirit of democracy and the establishment of a republic. Revolutionary forces seized key Japanese cities by surprise, and Imperial forces who declared martial law across the country withdrew from the borders to protect the despicable fascist leadership.\n\nThe fascists have sworn to destroy the entire country rather than see their homeland fall into the hands of democrats."
 fkr_news.6.a:0 "Let's hope peace returns to Asia soon..."
 fkr_news.6.b:0 "There is no turning back now."
 fkr_news.6.c:0 "Betrayed by the army! Suppress them immediately."

 # The Fall of Tokyo (FKR) Original 135
 fkr_news.7.title:0 "Fall of Tokyo"
 fkr_news.7.desc:0 "After days of siege, Tokyo has been completely secured by [FKR.GetNameDef] forces. According to a statement by the [FKR.GetNameDef] command spokesperson, although the Emperor had already left the city before the offensive began, there were fierce battles near the Imperial Palace as fanatical Japanese soldiers were guarding it.\n\nExperts predict that organized resistance in the remaining Japanese mainland will soon collapse with the fall of Tokyo. Unless hardliners in Japan succeed in persuading the Emperor to fight to the last man, peace negotiations are expected to begin soon. Although mostly damaged, many buildings, including the Imperial Palace, are currently under the command of [FKR.GetNameDef] military authorities.\n\nForeign reporters witnessed a grand victory parade featuring columns of countless [FKR.GetNameDef] soldiers marching through the city. Japanese citizens standing on the streets remained silent as they watched the marching [FKR.GetNameDef] troops."
 fkr_news.7.a:0 "Remarkable progress."
 fkr_news.7.b:0 "Avenged the humiliation of 1910."
 fkr_news.7.c:0 "This is a disaster!"
 # The Fall of Hong Kong Original 123
 fkr_news.8.title:0 "Fall of Hong Kong"
 fkr_news.8.desc:0 "[FKR.GetNameDef] forces broke through the Gin Drinkers Line and landed on Hong Kong Island, occupying British Hong Kong. The garrison was soon in an indefensible situation, and the colonial governor personally came to the Peninsula Hotel in Hong Kong, which [FKR.GetNameDef] used as headquarters, to surrender.\n\nAfter a brief celebration, the new [FKR.GetNameDef] governor took office, announcing to the world that 'New Hong Kong' has been 'liberated from Western colonialism'."
 fkr_news.8.a:0 "Remarkable progress."
 fkr_news.8.b:0 "Another victory for the fatherland."
 fkr_news.8.c:0 "This is a disaster!"
 # The Fall of Paris (USSR) Original 142
 fkr_news.9.title:0 "Fall of Paris"
 fkr_news.9.desc:0 "The advance of [FKR.GetNameDef] forces continued relentlessly, and finally, reports came that the French capital had fallen. As [FKR.GetNameDef] troops entered the city, French communists supported them and joined in attacking the retreating French Army.\n\nPropaganda claiming to have achieved 'liberation from bourgeois oppression' was scattered throughout Paris."
 fkr_news.9.a:0 "Remarkable progress."
 fkr_news.9.b:0 "Another victory for the fatherland."
 fkr_news.9.c:0 "This is a disaster!"
 # The Fall of London (USSR) Original 144
 fkr_news.10.title:0 "Fall of London"
 fkr_news.10.desc:0 "[FKR.GetNameDef]'s advance continued, and news came that [FKR.GetNameDef] troops have just occupied London. A parade by [FKR.GetNameDef] forces was swiftly conducted, proceeding without waiting for the final pockets of resistance remaining in the city to be completely cleared.\n\n[FKR.GetNameDef] sympathizers in London quickly submitted information on anti-[FKR.GetNameDef] elements to [FKR.GetNameDef] military authorities, and trials were held in Trafalgar Square to judge the most vicious ideological criminals."
 fkr_news.10.a:0 "Remarkable progress."
 fkr_news.10.b:0 "Another victory for the fatherland."
 fkr_news.10.c:0 "This is a disaster!"
 # The Fall of Moscow (Allies) Original 136
 fkr_news.11.title:0 "Fall of Moscow"
 fkr_news.11.desc:0 "After a series of fierce battles, [FKR.GetNameDef] forces captured the Soviet capital, Moscow. The urban area suffered extensive damage, and flames are still rising on both banks of the Moskva River. Despite intense air raids, the Kremlin retains some of its appearance and currently houses the [FKR.GetNameDef] occupation administration command.\n\nThe loss of Moscow has dealt a massive blow to the Soviet Union's war-fighting capability. Although most government functions are believed to have evacuated before the fall, military experts argue that the complete collapse of the Soviet Union is not far off."
 fkr_news.11.a:0 "Remarkable progress."
 fkr_news.11.b:0 "Another victory for the fatherland."
 fkr_news.11.c:0 "This is a disaster!"
 # The Fall of Washington Original 110
 fkr_news.12.title:0 "Fall of Washington"
 fkr_news.12.desc:0 "The battle for the Washington area ended today, and the last resistance in the city was annihilated as [FKR.GetNameDef] forces advanced along the Potomac tributaries.\n\nThick layers of smoke fill the city, and rumors say some of the smoke is from OSS agents burning classified documents until the last moment. [FKR.GetNameDef] special forces secured the White House after engaging presidential guards for a short while. However, it seems the US President was safely evacuated a few days ago.\n\nThe fall of the US capital proved the terrifying power of the [FKR.GetNameDef] war machine."
 fkr_news.12.a:0 "Remarkable progress."
 fkr_news.12.b:0 "Another victory for the fatherland."
 fkr_news.12.c:0 "This is a disaster!"
 # The Fall of New York Original 111
 fkr_news.13.title:0 "Fall of New York"
 fkr_news.13.desc:0 "Reportedly, after hours of street fighting with armed irregulars, the [FKR.GetNameDef] vanguard advanced to New York City and seized control.\n\nImprovised anti-tank barriers along 5th Avenue were useless, and [FKR.GetNameDef] forces attacked block by block into Manhattan.\n\nUncontrollable fires that have been occurring in the eastern part of the city for days are illuminating the skyline even at night.\n\nRepeating once again: New York has fallen."
 fkr_news.13.a:0 "Remarkable progress."
 fkr_news.13.b:0 "Another victory for the fatherland."
 fkr_news.13.c:0 "This is a disaster!"
 # The Fall of Singapore Original 117
 fkr_news.14.title:0 "Fall of Singapore"
 fkr_news.14.desc:0 "Singapore, called the Gibraltar of the East and considered an impregnable fortress by its former owner, Britain, has been occupied by [FKR.GetNameDef] forces.\n\nThe [FKR.GetNameDef] administration command in Singapore has made the Fullerton Building its headquarters. [FKR.GetNameDef] military police are patrolling the streets in groups, conveying the message everywhere that [FKR.GetNameDef] forces will now be stationed there."
 fkr_news.14.a:0 "Remarkable progress."
 fkr_news.14.b:0 "Another victory for the fatherland."
 fkr_news.14.c:0 "This is a disaster!"
 # The Fall of Pearl Harbor Original 118
 fkr_news.15.title:0 "Surprise Attack on Pearl Harbor!"
 fkr_news.15.desc:0 "[FKR.GetNameDef] forces swept through and occupied Honolulu, the largest city on Oahu in the Hawaiian Islands. The Pearl Harbor Naval Base, where the US Pacific Fleet headquarters was located, has also fallen.\n\nAccording to witnesses, the beleaguered US Navy and Marines retreated to Ford Island and resisted tenaciously, but succumbed to concentrated shelling and aerial bombardment. With the occupation of Hawaii, the powerful influence of the [FKR.GetNameDef] fleet continues to grow."
 fkr_news.15.a:0 "Remarkable progress."
 fkr_news.15.b:0 "Another victory for the fatherland."
 fkr_news.15.c:0 "This is a disaster!"
 # The Fall of Sydney Original 119
 fkr_news.16.title:0 "Liberation of New South Wales"
 fkr_news.16.desc:0 "As the Ministry of National Defense widely expanded southern military operations, the Armed Forces finally occupied Sydney, Australia's capital. Australian local defense forces were forced to regroup at Observatory Hill, and attempts to blow up the bridge were thwarted by advancing [FKR.GetNameDef] forces.\n\nNow Taegeukgis are flying all around Sydney Town Hall, which will now serve as the new headquarters for the military administration. [FKR.GetNameDef] military police are maintaining order in the streets while armed."
 fkr_news.16.a:0 "Remarkable progress."
 fkr_news.16.b:0 "Another victory for the fatherland."
 fkr_news.16.c:0 "This is a disaster!"
 # The Fall of Los Angeles Original 120
 fkr_news.17.title:0 "Fall of Los Angeles!"
 fkr_news.17.desc:0 "Los Angeles has finally fallen. The attack on Los Angeles was actually foreseen as the despicable [FKR.GetNameDef] forces established a foothold for the invasion of the US mainland. According to sources, immediately after occupying Los Angeles, [FKR.GetNameDef] forces are conducting a military parade on Central Avenue, and [FKR.GetNameDef] news reporters have recorded the entire situation. The [FKR.GetNameDef] military police arrested Los Angeles Mayor Fletcher Bowron, who failed to escape.\n\nIt is reported that brave US soldiers who volunteered to stay behind while the US army retreated are engaging in fierce guerrilla battles throughout the city center to save even one more American citizen. Hollywood suffered particularly heavy damage, and despicable [FKR.GetNameDef] officers took photos in front of the faded Hollywood Sign of the United States."
 fkr_news.17.a:0 "Remarkable progress."
 fkr_news.17.b:0 "Another victory for the fatherland."
 fkr_news.17.c:0 "This is a disaster!"
 # The Fall of Vladivostok Original 122
 fkr_news.18.title:0 "Fall of Vladivostok"
 fkr_news.18.desc:0 "Vladivostok, the largest city in the Far East and home port of the Soviet Pacific Fleet, was swept by [FKR.GetNameDef] forces. Losing the terminus of the Trans-Siberian Railway will be a major hindrance to future war efforts in Asia.\n\nMany ethnic Korean residents reportedly welcomed the [FKR.GetNameDef] forces and expressed sincere joy at being liberated from 'communist' oppression."
 fkr_news.18.a:0 "Remarkable progress."
 fkr_news.18.b:0 "Another victory for the fatherland."
 fkr_news.18.c:0 "This is a disaster!"
 # The Fall of Manila Original 124
 fkr_news.19.title:0 "Manila Falls!"
 fkr_news.19.desc:0 "Despite the struggles of the Philippine garrison and brave US soldiers, Manila, the capital of the Commonwealth of the Philippines, eventually fell into the hands of [FKR.GetNameDef] forces. Philippine garrison troops and civilians who escaped just before Manila fell are evacuating under the escort of US coastal artillery at the entrance to Manila Bay, and the Stars and Stripes still flies on the strategic Corregidor Island under the US soldiers' will to fight to the death.\n\nHowever, with Manila falling to [FKR.GetNameDef] forces, the fall of the rest of the Philippine archipelago has become a matter of time. The US Pacific Command dismissed the commander in charge of the Battle of Manila, and a civilian evacuation plan to withdraw as many Americans and Filipinos as possible to the US will be implemented. The Philippine War will be recorded as a painful defeat for the United States in Asia and the Pacific."
 fkr_news.19.a:0 "Remarkable progress."
 fkr_news.19.b:0 "Another victory for the fatherland."
 fkr_news.19.c:0 "This is a disaster!"
 # The Fall of New Delhi original 126
 fkr_news.20.title:0 "Fall of New Delhi"
 fkr_news.20.desc:0 "New Delhi, the center of India, has been occupied by [FKR.GetNameDef] forces. As the capital of British India and a massive strategic center, this city will be a decisive key point in the ongoing Indian liberation operation by [FKR.GetNameDef] forces.\n\nAdditionally, news is coming in that [FKR.GetNameDef] search parties urgently arrested the Governor-General of India escaping from the Viceroy's House. However, this has not been officially confirmed yet, and an official announcement by the [FKR.GetNameDef] military is expected soon. [FKR.GetNameDef]'s military operation in India is currently ongoing."
 fkr_news.20.a:0 "Remarkable progress."
 fkr_news.20.b:0 "Another victory for the fatherland."
 fkr_news.20.c:0 "This is a disaster!"
 # The Fall of the Panama Canal original 127
 fkr_news.21.title:0 "Panama Surrenders"
 fkr_news.21.desc:0 "To deal a decisive blow to the US war effort, [FKR.GetNameDef] forces landed in Panama, obtained the surrender of the garrison, and secured the canal.\nSome US garrison troops and Panamanian government forces refused to surrender and escaped into the nearby jungle, confirmed to be conducting guerrilla warfare, but they do not seem very threatening to the local [FKR.GetNameDef] forces.\n\nWith the canal fallen, the US Navy must now detour around the South American continent to reach the US West Coast or the Pacific. Now the [FKR.GetNameDef] Navy has gained a massive strategic advantage."
 fkr_news.21.a:0 "Remarkable progress."
 fkr_news.21.b:0 "Another victory for the fatherland."
 fkr_news.21.c:0 "This is a disaster!"
 # The Fall of Berlin (USA) original 128
 fkr_news.22.title:0 "Fall of Berlin"
 fkr_news.22.desc:0 "According to a statement by the [FKR.GetNameDef] government this afternoon, the chief spokesperson of the [FKR.GetNameDef] government officially announced that as the last German forces in Berlin surrendered, Berlin will now be under the control of [FKR.GetNameDef] forces for peacekeeping and military administration. Fighting in the Berlin urban area was fierce, and it was also confirmed that German engineers blew up the Moltke Bridge to stop the advance of [FKR.GetNameDef] forces.\n\nWith the Spree River crossing operation by [FKR.GetNameDef] forces continuing a few days ago, [FKR.GetNameDef] forces succeeded in securing key points in Berlin, and despite fierce resistance from German forces, [FKR.GetNameDef] forces captured the Kroll Opera House and the Reichstag. Currently, the Taegeukgi flies over the Reichstag, and with the surrender of German remnants, the battle in the city is now completely over. The Battle of Berlin has ended."
 fkr_news.22.a:0 "Remarkable progress."
 fkr_news.22.b:0 "Another victory for the fatherland."
 fkr_news.22.c:0 "This is a disaster!"
 # The Fall of Cairo (Germany) Original 109
 fkr_news.23.title:0 "Liberation of Cairo!"
 fkr_news.23.desc:0 "Cairo, the capital of Egypt, was finally liberated by a general offensive of [FKR.GetNameDef] forces that took place this morning.\n\nAs Allied forces retreated disorderly into the desert, [FKR.GetNameDef] soldiers were cheered as liberators by countless citizens who considered Britain an oppressor.\n\nThe fall of Cairo will be a massive loss to the Allied war effort, and many experts evaluated that [FKR.GetNameDef]'s path to conquering Africa and the Middle East has opened wide."
 fkr_news.23.a:0 "Remarkable progress."
 fkr_news.23.b:0 "Another victory for the fatherland."
 fkr_news.23.c:0 "This is a disaster!"

 fkr_news.24.title:0 "Siege of Nanjing Ends"
 fkr_news.24.desc:0 "Nanjing, the capital and center of the Republic of China, eventually fell to [FKR.GetNameDef] after a fierce siege. The defenders resisted fiercely in the walled city, but [FKR.GetNameDef] forces secured the Zhongshan Gate and fought to secure access to the inner city.\n\nSporadic gunfire is still heard and fierce resistance by Chinese forces continues in some city centers, but most remaining Chinese forces have withdrawn or been captured. Along with the occupation of Shanghai, this is a major victory giving significant meaning to [FKR.GetNameDef] in the Sino-Korean War."
 fkr_news.24.a:0 "Remarkable progress."
 fkr_news.24.b:0 "Another victory for the fatherland."
 fkr_news.24.c:0 "This is a disaster!"

 fkr_news.25.title:0 "Keijo Falls!"
 fkr_news.25.desc:0 "Keijo, the center of [KOR.GetNameDef], has fallen. According to the [FKR.GetNameDef] government, it was announced this morning that the Armed Forces reclaimed Keijo, the capital of [KOR.GetNameDef], and secured complete control.\n\nThe [KOR.GetNameDef] Defense Command had already retreated to the northern part of the Korean Peninsula, and as rebel forces advanced along the Han River tributaries, the last resistance occurring sporadically around Keijo city was annihilated. Also, the Japanese Government-General of Korea building, the heart of the Japanese Empire, was destroyed due to fierce combat. Military experts of the world were shocked by the tactical capabilities possessed by Korea's unidentified military organization, and some claim that certain powers aiming to check Japan secretly supported Korean independence forces. Meanwhile, with the collapse of [KOR.GetNameDef], many political science experts diagnosed that Japan is taking steps toward downfall."
 fkr_news.25.a:0 "Let us pay respect to them."
 fkr_news.25.b:0 "Independence is at hand."
 fkr_news.25.c:0 "This is a disaster!"

 fkr_news.26.title:0 "Second Spanish Civil War"
 fkr_news.26.desc:0 "Civil war has broken out again in Spain! Several high-ranking royalist figures seeking to overthrow the current government have declared a rebellion, and a significant portion of the Spanish army is responding to it.\n\nThese royalist forces have seized most of Spanish territory, including overseas territories.\nThe Spanish army and volunteers gathered under the republican government have resolved to fight to the end against this rebellion.\n\nA bloody war has begun once again in Spain."
 fkr_news.26.a:0 "Another civil war?"
 fkr_news.26.b:0 "It is time for us to help them!"
 