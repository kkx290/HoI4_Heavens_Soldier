l_english:
################################## EVENTS ##############################################
 fkr.1.title:0 "Jeju Island Forward Base"
 fkr.1.desc:0 "After a long debate, the high-ranking staff of the Armed Forces who traveled to the past have concluded that they have time-traveled to the interwar period. Following Emergency Order No. 18 from Admiral Eom Hyun-sung, we have successfully secured full control of major facilities on Jeju Island.\n\nHowever, if we take no action, our military activities will soon be detected by Japan. If Japan discovers that a paramilitary organization has taken control of Jeju Island, a punitive expedition against us is highly likely to occur.\n\nFortunately, the administrative power of [KOR.GetNameDef], weakened by Japanese bureaucracy, internal strife, and an incompetent leadership, is distant enough from Jeju Island. We can conceal our activities while securing ammunition and replenishing manpower for the mainland advance, but we cannot hide in the shadow of Jeju Island forever. Over time, it will become increasingly difficult to hide our existence from them."
 fkr.1.a:0 "Our time will come soon."
 fkr.1.a.tt:0 "Activates decision: §YConceal Activities in Jeju§!.\nThis allows you to use £pol_power §YPolitical Power§! to prevent [KOR.GetNameDef] from discovering our military activities.\nThe £pol_power §YPolitical Power§! cost for this military and administrative concealment will increase by 10 each time it is used!"

 fkr.2.title:0 "Rumors from Jeju Island Were True!"
 fkr.2.desc:0 "The unbelievable has happened. Loss of contact with Jeju Island, rumors of soldiers armed with unknown technology, and an unidentified armed group is within our territory."
 fkr.2.a:0 "There is no time to waste. Declare a punitive expedition!"
 fkr.2.b:0 "There is nothing we can do."

 fkr.3.title:0 "Army Tactics Development"
 fkr.3.desc:0 "Our Doctrine Development Department has proposed several tactical doctrines suitable for the current army based on future strategy manuals. Which tactic should we choose?"
 fkr.3.a:0 "Mobile Warfare Tactics"
 fkr.3.b:0 "Superior Firepower Tactics"
 fkr.3.c:0 "Grand Battleplan Tactics"
 fkr.3.d:0 "Mass Assault Tactics"

 fkr.4.title:0 "Navy Tactics Development"
 fkr.4.desc:0 "Our Doctrine Development Department has proposed several tactical doctrines suitable for the current navy based on future strategy manuals. Which tactic should we choose?"
 fkr.4.a:0 "Fleet in Being Tactics"
 fkr.4.b:0 "Trade Interdiction Tactics"
 fkr.4.c:0 "Base Strike Tactics"

 fkr.5.title:0 "Air Force Tactics Development"
 fkr.5.desc:0 "Our Doctrine Development Department has proposed several tactical doctrines suitable for the current air force based on future strategy manuals. Which tactic should we choose?"
 fkr.5.a:0 "Strategic Destruction Tactics"
 fkr.5.b:0 "Battlefield Support Tactics"
 fkr.5.c:0 "Operational Integrity Tactics"

 fkr.6.title:0 "Liberation of the Mainland"
 fkr.6.desc:0 "The Republic of Korea Armed Forces and the Liberation Army participating in the mainland advance operation have successfully reclaimed the Korean Peninsula in the war against [JAP.GetNameDef]. Major cities on the Korean Peninsula have been completely liberated from [JAP.GetNameDef], and shouts of 'Long Live Korean Independence' are ringing out across the country in celebration of the victory.\n\nMeanwhile, the Provisional Government, having regained the peninsula, is in deep contemplation regarding this unpredictable war. Some figures in the Liberation Army argue to use this momentum to attack the Japanese mainland, while the Combined Forces Command wishes to dispatch diplomats to [JAP.GetNameDef] to restore sovereignty over the Korean Peninsula and end the war to plan for the future."
 fkr.6.a:0 "Propose negotiations."
 fkr.6.a.tt:0 "If [JAP.GetNameDef] accepts the proposal, the war will end."
 fkr.6.b:0 "No, we go all the way."

 fkr.7.title:0 "Diplomat from [FKR.GetNameDef]"
 fkr.7.desc:0 "The Korean Peninsula is now out of our control. A delegation from Korea has arrived to discuss a peace treaty. [FKR.GetLeader] expressed firm support for us out of fear of a prolonged war during the negotiations. The delegation reminded us that the fate of [JAP.GetNameDef] depends on us, and if [MAN.GetNameDef] falls into the hands of [FKR.GetNameDef], we will be isolated from the continent."
 fkr.7.a:0 "We will accept."
 fkr.7.a.tt:0 "[FKR.GetNameDef] will annex [KOR.GetNameDef] and end the war with us."
 fkr.7.b:0 "Nonsense!"

 fkr.8.title:0 "Accept [JAP.GetNameDef]'s Proposal"
 fkr.8.desc:0 "We have received a report from the diplomat that [JAP.GetNameDef] has accepted our peace treaty proposal."
 fkr.8.a:0 "Long live Korea!"

 fkr.9.title:0 "Refuse [JAP.GetNameDef]'s Proposal"
 fkr.9.desc:0 "[JAP.GetNameDef]'s leader [JAP.GetLeader] has rejected our peace treaty proposal, stating that the conditions are unacceptable."
 fkr.9.a:0 "[JAP.GetNameDef] will disappear from the face of the earth!"

 fkr.10.title:0 "New Capital of [FKR.GetNameDef]"
 fkr.10.desc:0 "The time has come to destroy the last traces of Japanese rule in the free Korean Peninsula liberated from [JAP.GetNameDef]. The impiety of the name given by the Japanese still attached to the capital representing the new Korea mocks the soldiers sacrificed in the process of gaining the city.\n\nThe National Assembly has presented a proposal to the government to rectify this terrible situation."
 fkr.10.a:0 "Change to 'Seoul'"
 fkr.10.b:0 "Change to 'Hanseong'"
 fkr.10.c:0 "Change to 'Hanyang'"
 fkr.10.d:0 "Keep as 'Gyeongseong'"

 fkr.11.title:0 "[FKR.GetNameDef]'s Demand for Monarchy Restoration"
 fkr.11.desc:0 "We are recently under severe pressure from [FKR.GetNameDef] to return authority to the royal family who were the masters of this land in the past. The [FKR.GetNameDef] government claims they may even start a war over this issue.\n\nWe are being forced to make a choice."
 fkr.11.a:0 "Power must be given back to the King."
 fkr.11.b:0 "We are not interested."
 fkr.12.title:0 "[JAP.GetNameDefCap] Refuses Demands"
 fkr.12.desc:0 "[JAP.GetLeader] sent a brief message stating that close relations with [FKR.GetNameDef] are 'not currently a concern of the [JAP.GetAdjective] government' and refused to meet with our delegation in Tokyo.\n\nWe demanded further clarification, but there is no response."
 fkr.12.a:0 "War is the only solution!"
