 FKR_GATHERING_STORM_DESC:0 "With the Japan-Korea Annexation Treaty of 1910, Korea lost all sovereign capabilities and began to function as a colony and puppet government of the Japanese Empire. Resenting this turn of events, many Koreans fled their homeland to wage independence campaigns across Asia.\n\nIn 1936, 26 years after the treaty, ships belonging to an unidentified armed group suddenly appeared near Jeju Island, off the southern coast of the Korean Peninsula. With the arrival of this armed group possessing technology far beyond the era, how will the course of world history change? \n\nDeveloper BlueCokeWine"