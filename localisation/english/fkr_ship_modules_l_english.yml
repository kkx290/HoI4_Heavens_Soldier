#region Module DESC
 ship_light_battery_future_1_desc:0 "Although somewhat faded with the advent of anti-ship missiles, modern autoloading systems and targeting capabilities provide better firepower."
 ship_light_battery_future_2_desc:0 "Although somewhat faded with the advent of anti-ship missiles, modern autoloading systems and targeting capabilities provide better firepower."
 ship_missile_launcher_future_1_desc:0 "A launcher designed to fire ship-to-ship missiles."
 ship_missile_launcher_future_2_desc:0 "A launcher designed to fire ship-to-ship missiles."
 ship_secondaries_future_1_desc:0 "Small turrets equipped with rapid-fire guns designed to defend capital ships from destroyers and torpedo boats."
 ship_secondaries_future_2_desc:0 "Small turrets equipped with rapid-fire guns designed to defend capital ships from destroyers and torpedo boats."
 ship_anti_air_future_1_desc:0 "The latest anti-aircraft gun models feature electric mechanisms capable of tracking high-speed targets and advanced director systems that control the fire of multiple guns against a single target."
 ship_anti_air_future_2_desc:0 "The latest anti-aircraft gun models feature electric mechanisms capable of tracking high-speed targets and advanced director systems that control the fire of multiple guns against a single target."
 ship_fire_control_system_future_1_desc:0 "More complex computer machines consider various factors when calculating ballistic results to engage targets."
 ship_fire_control_system_future_2_desc:0 "More complex computer machines consider various factors when calculating ballistic results to engage targets."
 ship_radar_future_1_desc:0 "A radar that arranges multiple transmit/receive modules and individually controls the phase of the radio waves transmitted and received by each module to provide directivity."
 ship_radar_future_2_desc:0 "A radar that arranges multiple transmit/receive modules and individually controls the phase of the radio waves transmitted and received by each module to provide directivity."
 light_ship_engine_future_1_desc:0 "Improved engine configuration and turbine gearing allow for higher efficiency with the same weight."
 light_ship_engine_future_2_desc:0 "Improved engine configuration and turbine gearing allow for higher efficiency with the same weight."
 sub_ship_engine_future_1_desc:0 "Advanced turbocharged engines are much faster at tracking targets for short periods or recharging batteries."
 sub_ship_engine_future_2_desc:0 "Advanced turbocharged engines are much faster at tracking targets for short periods or recharging batteries."
 sub_ship_engine_future_nuclear_desc:0 "Using nuclear reactors for ship engines provides unlimited range."
 cruiser_ship_engine_future_1_desc:0 "Advanced materials allow these engines to operate for much longer periods at high loads."
 cruiser_ship_engine_future_2_desc:0 "Advanced materials allow these engines to operate for much longer periods at high loads."
 cruiser_ship_engine_future_nuclear_desc:0 "Using nuclear reactors for ship engines provides unlimited range."
 carrier_ship_engine_future_1_desc:0 "These modern large engines built to propel large ships allow aircraft carriers to have better combat capabilities."
 carrier_ship_engine_future_2_desc:0 "These modern large engines built to propel large ships allow aircraft carriers to have better combat capabilities."
 carrier_ship_engine_future_nuclear_desc:0 "Using nuclear reactors for ship engines provides unlimited range."
 ship_depth_charge_future_1_desc:0 "Anti-submarine helicopters are faster than submarines and offer the flexibility of vertical takeoff and landing from combat ships."
 ship_depth_charge_future_2_desc:0 "Anti-submarine helicopters are faster than submarines and offer the flexibility of vertical takeoff and landing from combat ships."
 ship_sonar_future_1_desc:0 "Modern Low Frequency Active (LFA) sonar uses low frequencies which have less energy loss in water, allowing for relatively long-range detection."
 ship_sonar_future_2_desc:0 "Modern Low Frequency Active (LFA) sonar uses low frequencies which have less energy loss in water, allowing for relatively long-range detection."
 ship_armor_cruiser_future_1_desc:0 "Designed to protect ships against smaller guns, this armor scheme significantly reduces weight, allowing for much higher speeds."
 ship_armor_cruiser_future_2_desc:0 "Designed to protect ships against smaller guns, this armor scheme significantly reduces weight, allowing for much higher speeds."
 ship_torpedo_future_1_desc:0 "Solving the mechanical problems of launching heavy torpedoes from surface ships, this advanced model can be quickly reloaded for another shot."
 ship_torpedo_future_2_desc:0 "Solving the mechanical problems of launching heavy torpedoes from surface ships, this advanced model can be quickly reloaded for another shot."
 ship_torpedo_sub_future_1_desc:0 "The addition of electric automatic loading allows torpedo tubes to be reloaded within minutes."
 ship_torpedo_sub_future_2_desc:0 "The addition of electric automatic loading allows torpedo tubes to be reloaded within minutes."
#endregion